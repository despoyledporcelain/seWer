<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const TRACKS = [
  { id:1, title:"Dissolve",       artist:"Nocturnal",   duration:214, color:"#7c5cbf" },
  { id:2, title:"Phase Shift",    artist:"Aeterna",     duration:187, color:"#4e72b8" },
  { id:3, title:"Нулевой этаж",   artist:"Ploho",       duration:253, color:"#b84e5a" },
  { id:4, title:"Cold Orbit",     artist:"Subwave",     duration:198, color:"#4eb8a0" },
  { id:5, title:"Архив",          artist:"Shortparis",  duration:271, color:"#b8934e" },
  { id:6, title:"Fading Pulse",   artist:"Nocturnal",   duration:224, color:"#4e90b8" },
  { id:7, title:"Полночь",        artist:"Motorama",    duration:243, color:"#b84ea8" },
  { id:8, title:"Ritual",         artist:"Molchat Doma",duration:198, color:"#62b84e" },
];

function fmt(s) {
  const m = Math.floor(s/60), sec = Math.floor(s%60);
  return `${m}:${sec.toString().padStart(2,'0')}`;
}

/* ── Magnet physics hook ─────────────────────────────────────────────────── */
function useMagnet(strength = 0.25) {
  const ref = useRef(null);
  const [xy, setXY] = useState({x:0, y:0});
  const raf = useRef(null);
  const current = useRef({x:0, y:0});
  const target  = useRef({x:0, y:0});

  const onMove = useCallback((e) => {
    const el = ref.current;
    if (!el) return;
    const r = el.getBoundingClientRect();
    const dx = (e.clientX - (r.left + r.width/2))  * strength;
    const dy = (e.clientY - (r.top  + r.height/2)) * strength;
    target.current = { x: Math.max(-8, Math.min(8, dx)), y: Math.max(-8, Math.min(8, dy)) };
  }, [strength]);

  const onLeave = useCallback(() => {
    target.current = {x:0, y:0};
  }, []);

  useEffect(() => {
    const loop = () => {
      const { x: cx, y: cy } = current.current;
      const { x: tx, y: ty } = target.current;
      const nx = cx + (tx - cx) * 0.12;
      const ny = cy + (ty - cy) * 0.12;
      current.current = {x: nx, y: ny};
      if (Math.abs(nx - cx) > 0.01 || Math.abs(ny - cy) > 0.01) {
        setXY({x: nx, y: ny});
      }
      raf.current = requestAnimationFrame(loop);
    };
    raf.current = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(raf.current);
  }, []);

  return { ref, xy, onMove, onLeave };
}

/* ── Wave Progress Bar ───────────────────────────────────────────────────── */
function WaveProgressBar({ progress, elapsed, total, onSeek, isPlaying }) {
  const wrapRef   = useRef(null);
  const canvasRef = useRef(null);
  const rafRef    = useRef(null);
  const progRef    = useRef(progress);
  const dispProg   = useRef(progress);
  const playRef    = useRef(isPlaying);
  const beatRef    = useRef(0);
  const dragging   = useRef(false);
  const H = 56;

  useEffect(() => { progRef.current = progress; }, [progress]);
  useEffect(() => { playRef.current = isPlaying; }, [isPlaying]);

  useEffect(() => {
    const canvas = canvasRef.current;
    const wrap   = wrapRef.current;
    if (!canvas || !wrap) return;
    const dpr = window.devicePixelRatio || 1;
    const resize = () => {
      const W = wrap.clientWidth;
      canvas.width  = W * dpr; canvas.height = H * dpr;
      canvas.style.width = W+'px'; canvas.style.height = H+'px';
    };
    resize();
    const ro = new ResizeObserver(resize);
    ro.observe(wrap);

    let t = 0;
    const draw = () => {
      t++;
      if (playRef.current && Math.random() < 0.02) beatRef.current = 0.6 + Math.random();
      beatRef.current *= 0.92;
      const beat = beatRef.current;

      const ctx = canvas.getContext('2d');
      const W = canvas.width, HH = canvas.height;
      ctx.clearRect(0, 0, W, HH);

      dispProg.current += (progRef.current - dispProg.current) * 0.06;
      const p = dispProg.current;

      const cy = HH * 0.5;
      const freq  = 0.020 / dpr, freq2 = 0.038 / dpr;
      const spd   = 0.022,       spd2  = 0.014;

      const env = (x) => {
        const nx   = x / W;
        const gauss = Math.exp(-Math.pow((nx - 0.5) * 2.6, 2));
        const edge  = Math.min(nx * 14, (1 - nx) * 14, 1);
        return gauss * edge;
      };

      const pts = [];
      for (let x = 0; x <= W; x += dpr) {
        const e = env(x);
        const baseAmp = HH * 0.26 * e;
        const beatAmp = beat * HH * 0.20 * e;
        const a = baseAmp + beatAmp;
        const y = cy
          + a * Math.sin(x * freq  - t * spd)
          + a * 0.38 * Math.sin(x * freq2 - t * spd2 + 1.8);
        pts.push({x, y});
      }

      const grad  = ctx.createLinearGradient(0, 0, W, 0);
      if (p > 0.005) {
        grad.addColorStop(0,                         '#9b7dff');
        grad.addColorStop(Math.min(p, 0.999),        '#9b7dff');
        grad.addColorStop(Math.min(p + 0.001, 1),    'rgba(255,255,255,0.18)');
      }
      grad.addColorStop(1, 'rgba(255,255,255,0.18)');

      ctx.beginPath();
      pts.forEach(({x,y}, i) => i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y));
      ctx.lineWidth   = 2.8 * dpr;
      ctx.lineCap     = 'round';
      ctx.lineJoin    = 'round';
      ctx.strokeStyle = grad;
      ctx.shadowColor = 'rgba(155,125,255,0.4)';
      ctx.shadowBlur  = 6 * dpr * p;
      ctx.stroke();
      ctx.shadowBlur  = 0;

      rafRef.current = requestAnimationFrame(draw);
    };
    rafRef.current = requestAnimationFrame(draw);
    return () => { cancelAnimationFrame(rafRef.current); ro.disconnect(); };
  }, []);

  const getVal = (e) => {
    const rect = canvasRef.current.getBoundingClientRect();
    return Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  };

  useEffect(() => {
    const onMove = (e) => { if (dragging.current) onSeek(getVal(e)); };
    const onUp   = () => { dragging.current = false; };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup',   onUp);
    return () => {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup',   onUp);
    };
  }, [onSeek]);

  return (
    <div style={{width:'100%'}}>
      <div ref={wrapRef} style={{width:'100%', cursor:'pointer'}}
        onMouseDown={e => { dragging.current = true; onSeek(getVal(e)); }}>
        <canvas ref={canvasRef} style={{display:'block'}}/>
      </div>
      <div style={{display:'flex', justifyContent:'space-between', marginTop:10,
                   fontSize:11, color:'rgba(255,255,255,0.22)'}}>
        <span>{fmt(elapsed)}</span><span>{fmt(total)}</span>
      </div>
    </div>
  );
}

/* ── Vertical Volume Wave ────────────────────────────────────────────────── */
function VerticalVolumeWave({ volume, onChange }) {
  const wrapRef   = useRef(null);
  const canvasRef = useRef(null);
  const rafRef    = useRef(null);
  const volRef    = useRef(volume);
  const dragging  = useRef(false);
  const W = 18;

  useEffect(() => { volRef.current = volume; }, [volume]);

  useEffect(() => {
    const canvas = canvasRef.current;
    const wrap   = wrapRef.current;
    if (!canvas || !wrap) return;
    const dpr = window.devicePixelRatio || 1;
    const resize = () => {
      const HH = wrap.clientHeight;
      canvas.height = HH * dpr; canvas.width = W * dpr;
      canvas.style.height = HH+'px'; canvas.style.width = W+'px';
    };
    resize();
    const ro = new ResizeObserver(resize);
    ro.observe(wrap);

    let t = 0;
    const draw = () => {
      t++;
      const ctx = canvas.getContext('2d');
      const WW = canvas.width, HH = canvas.height;
      ctx.clearRect(0, 0, WW, HH);
      const cx   = WW * 0.5;
      const amp  = WW * 0.28;
      const freq = 0.028 / dpr;
      const spd  = 0.022;
      const fillY = HH * (1 - volRef.current);

      const grad = ctx.createLinearGradient(0, 0, 0, HH);
      grad.addColorStop(0, 'rgba(255,255,255,0.09)');
      if (volRef.current > 0.005) {
        grad.addColorStop(Math.max(0, fillY / HH), 'rgba(255,255,255,0.09)');
        grad.addColorStop(Math.min(1, fillY / HH + 0.001), '#9b7dff');
      }
      grad.addColorStop(1, '#9b7dff');

      ctx.beginPath();
      let first = true;
      for (let y = 0; y <= HH; y += dpr) {
        const x = cx + amp * Math.sin(y * freq - t * spd)
                     + amp * 0.3 * Math.sin(y * freq * 1.7 - t * spd * 0.65 + 2);
        first ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        first = false;
      }
      ctx.lineWidth   = 1.8 * dpr;
      ctx.lineCap     = 'round';
      ctx.strokeStyle = grad;
      ctx.shadowColor = 'rgba(155,125,255,0.35)';
      ctx.shadowBlur  = volRef.current * 5 * dpr;
      ctx.stroke();
      ctx.shadowBlur  = 0;

      rafRef.current = requestAnimationFrame(draw);
    };
    rafRef.current = requestAnimationFrame(draw);
    return () => { cancelAnimationFrame(rafRef.current); ro.disconnect(); };
  }, []);

  const getVal = (e) => {
    const rect = canvasRef.current.getBoundingClientRect();
    return Math.max(0, Math.min(1, 1 - (e.clientY - rect.top) / rect.height));
  };

  useEffect(() => {
    const onMove = (e) => { if (dragging.current) onChange(getVal(e)); };
    const onUp   = () => { dragging.current = false; };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup',   onUp);
    return () => {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup',   onUp);
    };
  }, [onChange]);

  return (
    <div ref={wrapRef} style={{flex:1, cursor:'ns-resize', display:'flex', alignItems:'stretch'}}
      onMouseDown={e => { dragging.current = true; onChange(getVal(e)); }}>
      <canvas ref={canvasRef} style={{display:'block'}}/>
    </div>
  );
}

/* ── Physics Button ──────────────────────────────────────────────────────── */
function MagBtn({ onClick, active, children, size=44 }) {
  const { ref, xy, onMove, onLeave } = useMagnet(0.28);
  const [pressed, setPressed] = useState(false);
  return (
    <button ref={ref} onClick={onClick}
      onMouseMove={onMove} onMouseLeave={() => { onLeave(); }}
      onMouseDown={() => setPressed(true)}
      onMouseUp={() => setPressed(false)}
      style={{
        width:size, height:size, borderRadius:'50%', border:'none', background:'none',
        color: active ? 'var(--accent)' : 'rgba(255,255,255,0.42)',

/* ── Transition overlay ──────────────────────────────────────────────────── */
function RevealOverlay({ x, y, color, phase }) {
  return ReactDOM.createPortal(
    <div style={{
      position:'fixed', inset:0, zIndex:900, pointerEvents:'none',
      background: color,
      clipPath: phase === 'expand'
        ? `circle(200% at ${x}px ${y}px)`
        : `circle(0% at ${x}px ${y}px)`,
      transition: phase === 'expand'
        ? 'clip-path 0.55s cubic-bezier(0.4,0,0.2,1)'
        : 'none',
      opacity:0.6,
    }}/>,
    document.body
  );
}

        if (next >= 1) { handleNext(); return 0; }
        return next;
      });
