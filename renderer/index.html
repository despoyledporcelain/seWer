<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

function smoothScroll(el, targetTop, duration) {
  const startTop = el.scrollTop;
  const delta    = targetTop - startTop;
  if (!delta) return;
  const t0 = performance.now();
  function ease(x) { return x < 0.5 ? 2*x*x : 1 - Math.pow(-2*x + 2, 2)/2; }
  function tick(now) {
    const p = Math.min((now - t0) / duration, 1);
    el.scrollTop = startTop + delta * ease(p);
    if (p < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

const DEMO_TRACKS = [
  { id:1, title:"Dissolve",       artist:"Nocturnal",   duration:214, color:"#7c5cbf" },
  { id:2, title:"Phase Shift",    artist:"Aeterna",     duration:187, color:"#4e72b8" },

function fmt(s) {
  const m = Math.floor(s/60), sec = Math.floor(s%60);
  return `${m}:${sec.toString().padStart(2,'0')}`;
}

/* ── Magnet spring hook ──────────────────────────────────────────────────── */
function useMagnet(strength = 0.25, { spring = 0.10, damping = 0.74, clamp = 12 } = {}) {
  const ref       = useRef(null);
  const [xy, setXY] = useState({x:0, y:0});
  const raf       = useRef(null);
  const pos       = useRef({x:0, y:0});
  const vel       = useRef({x:0, y:0});
  const target    = useRef({x:0, y:0});
  const isHovered = useRef(false);
  const SPRING = spring, DAMPING = damping, CLAMP = clamp;

  const onMove = useCallback((e) => {
    const el = ref.current; if (!el) return;
    isHovered.current = true;
    const r = el.getBoundingClientRect();
    const dx = (e.clientX - (r.left + r.width/2))  * strength;
    const dy = (e.clientY - (r.top  + r.height/2)) * strength;
    target.current = { x: Math.max(-CLAMP, Math.min(CLAMP, dx)), y: Math.max(-CLAMP, Math.min(CLAMP, dy)) };
  }, [strength]);

  const onLeave = useCallback(() => {
    isHovered.current = false;
    target.current = {x:0, y:0};
  }, []);

  useEffect(() => {
    const loop = () => {
      const { x:cx, y:cy } = pos.current;
      const { x:tx, y:ty } = target.current;
      const { x:vx, y:vy } = vel.current;
      const nvx = (vx + (tx-cx)*SPRING)*DAMPING;
      const nvy = (vy + (ty-cy)*SPRING)*DAMPING;
      const nx = cx+nvx, ny = cy+nvy;
      pos.current = {x:nx, y:ny};
      vel.current = {x:nvx, y:nvy};
      const moving = Math.abs(nx)>0.003||Math.abs(ny)>0.003||Math.abs(nvx)>0.003||Math.abs(nvy)>0.003;
      if (moving || isHovered.current) setXY({x:nx, y:ny});
      else setXY(p => (p.x===0&&p.y===0)?p:{x:0,y:0});
      raf.current = requestAnimationFrame(loop);
    };
    raf.current = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(raf.current);
  }, []);

  return { ref, xy, onMove, onLeave };
}

/* ── Wave Progress Bar ───────────────────────────────────────────────────── */
function WaveProgressBar({ progress, elapsed, total, onSeek, isPlaying }) {
  const wrapRef   = useRef(null);
  const canvasRef = useRef(null);
  const rafRef    = useRef(null);
  const progRef   = useRef(progress);
  const dispProg  = useRef(progress);
  const playRef   = useRef(isPlaying);
  const beatRef   = useRef(0);
  const beatTgt   = useRef(0);
  const dragging   = useRef(false);
  const startTime  = useRef(null);
  const pendingSize = useRef(null);
  const H = 52;

  useEffect(() => { progRef.current = progress; }, [progress]);
  useEffect(() => { playRef.current = isPlaying; }, [isPlaying]);

  useEffect(() => {
    const canvas = canvasRef.current, wrap = wrapRef.current;
    if (!canvas || !wrap) return;
    const dpr = window.devicePixelRatio || 1;
    // initial size — canvas style controlled by CSS (width:100%)
    canvas.width  = Math.round(wrap.clientWidth * dpr);
    canvas.height = Math.round(H * dpr);
    const resize = () => {
      const nW = Math.round(wrap.clientWidth * dpr), nH = Math.round(H * dpr);
      if (canvas.width !== nW || canvas.height !== nH) pendingSize.current = { w: nW, h: nH };
    };
    const ro = new ResizeObserver(resize);
    ro.observe(wrap);

    const draw = (now) => {
      if (pendingSize.current) {
        canvas.width  = pendingSize.current.w;
        canvas.height = pendingSize.current.h;
        pendingSize.current = null;
      }
      if (!startTime.current) startTime.current = now;
      const t = (now - startTime.current) * 0.001;

      const ctx = canvas.getContext('2d');
      const W = canvas.width, HH = canvas.height;
      ctx.clearRect(0, 0, W, HH);

      dispProg.current += (progRef.current - dispProg.current) * 0.12;
      const p = dispProg.current;
      const beat = 0;
      const cy = HH*0.5;
      const freq = 0.020/dpr, freq2 = 0.038/dpr;

      const env = (x) => {
        const nx = x/W;
        /* sharp fade at edges, flat middle */
        const edge = Math.min(nx/0.04, (1-nx)/0.04, 1);
        const gauss = Math.exp(-Math.pow((nx-0.5)*2.4, 2));
        return gauss * edge;
      };

      const pts = [];
      for (let x = 0; x <= W; x += dpr) {
        const e = env(x);
        const a = (HH*0.26 + beat*HH*0.18) * e;
        const y = cy + a*Math.sin(x*freq - t*1.4) + a*0.38*Math.sin(x*freq2 - t*0.9 + 1.8);
        pts.push({x, y});
      }

      /* gradient with alpha fade at edges */
      const grad = ctx.createLinearGradient(0, 0, W, 0);
      const FADE = 0.04, TRANS = 0.018;
      grad.addColorStop(0, 'rgba(0,0,0,0)');
      grad.addColorStop(FADE, p > FADE + TRANS ? '#b2b2b2' : 'rgba(255,255,255,0.16)');
      if (p > FADE + TRANS && p < 1 - FADE - TRANS) {
        grad.addColorStop(Math.max(FADE + 0.001, p - TRANS), '#b2b2b2');
        grad.addColorStop(Math.min(1 - FADE - 0.001, p + TRANS), 'rgba(255,255,255,0.16)');
      }
      grad.addColorStop(1 - FADE, 'rgba(255,255,255,0.16)');
      grad.addColorStop(1, 'rgba(0,0,0,0)');

      ctx.beginPath();
      pts.forEach(({x,y}, i) => i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y));
      ctx.lineWidth   = 2.4*dpr;
      ctx.lineCap     = 'round';
      ctx.lineJoin    = 'round';
      ctx.strokeStyle = grad;
      ctx.shadowColor = `rgba(178,178,178,${0.3*p})`;
      ctx.shadowBlur  = 5*dpr*p;
      ctx.stroke();
      ctx.shadowBlur  = 0;

      rafRef.current = requestAnimationFrame(draw);
    };
    rafRef.current = requestAnimationFrame(draw);
    return () => { cancelAnimationFrame(rafRef.current); ro.disconnect(); };
  }, []);

  const getVal = (e) => {
    const rect = canvasRef.current.getBoundingClientRect();
    return Math.max(0, Math.min(1, (e.clientX - rect.left)/rect.width));
  };
  useEffect(() => {
    const onMove = (e) => { if (dragging.current) onSeek(getVal(e)); };
    const onUp   = () => { dragging.current = false; };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup',   onUp);
    return () => { document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); };
  }, [onSeek]);

  const timeStyle = {
    fontSize: 10, fontVariantNumeric: 'tabular-nums',
    color: 'rgba(255,255,255,0.22)', letterSpacing: '0.02em',
    userSelect: 'none', flexShrink: 0,
  };
  return (
    <div style={{width:'100%', display:'flex', alignItems:'center', gap:9}}>
      <span style={timeStyle}>{fmt(elapsed)}</span>
      <div ref={wrapRef} style={{flex:1, minWidth:0, overflow:'hidden', cursor:'pointer'}}
        onMouseDown={e => { dragging.current = true; onSeek(getVal(e)); }}>
        <canvas ref={canvasRef} style={{display:'block', width:'100%', height:H+'px'}}/>
      </div>
      <span style={timeStyle}>-{fmt(total - elapsed)}</span>
    </div>
  );
}

/* ── Thin Volume Slider ───────────────────────────────────────────────────── */
function ThinVolumeSlider({ volume, onChange }) {
  const wrapRef    = useRef(null);
  const canvasRef  = useRef(null);
  const rafRef     = useRef(null);
  const volActual  = useRef(volume); /* follows props when idle, follows cursor during drag */
  const volDisp    = useRef(volume); /* smoothly chases volActual */
  const dragging   = useRef(false);
  const trackWAnim = useRef(2);      /* animates between 2 and 4 on press */
  const handleRAnim= useRef(3.5);
  const onChangeCb = useRef(onChange);
  const TW = 28;

  useEffect(() => { onChangeCb.current = onChange; }, [onChange]);
  useEffect(() => { if (!dragging.current) volActual.current = volume; }, [volume]);

  const getVal = useCallback((e) => {
    const rect = canvasRef.current.getBoundingClientRect();
    return Math.max(0, Math.min(1, 1 - (e.clientY - rect.top)/rect.height));
  }, []);

  useEffect(() => {
    const canvas = canvasRef.current, wrap = wrapRef.current;
    if (!canvas || !wrap) return;
    const dpr = window.devicePixelRatio || 1;

    const resize = () => {
      canvas.height = wrap.clientHeight * dpr;
      canvas.width  = TW * dpr;
      canvas.style.height = wrap.clientHeight + 'px';
      canvas.style.width  = TW + 'px';
    };
    resize();
    const ro = new ResizeObserver(resize);
    ro.observe(wrap);

    const draw = () => {
      /* smooth display chases actual */
      const speed = dragging.current ? 0.09 : 0.04;
      volDisp.current += (volActual.current - volDisp.current) * speed;
      const v = volDisp.current;

      /* animate track thickness */
      const tgtTW = dragging.current ? 4 : 2;
      const tgtHR = dragging.current ? 6 : 3.5;
      trackWAnim.current  += (tgtTW - trackWAnim.current)  * 0.14;
      handleRAnim.current += (tgtHR - handleRAnim.current) * 0.14;
      const TRW = trackWAnim.current  * dpr;
      const HR  = handleRAnim.current * dpr;

      const ctx = canvas.getContext('2d');
      const WW = canvas.width, HH = canvas.height;
      ctx.clearRect(0, 0, WW, HH);

      const cx       = WW/2;
      const pad      = HR + 2*dpr;
      const trackH   = HH - pad*2;
      const fillTop  = pad + trackH*(1-v);
      const trackBot = HH - pad;

      /* track bg */
      ctx.beginPath();
      ctx.roundRect(cx - TRW/2, pad, TRW, trackH, TRW/2);
      ctx.fillStyle = 'rgba(255,255,255,0.07)';
      ctx.fill();

      /* fill */
      if (v > 0.005) {
        ctx.shadowColor = 'rgba(178,178,178,0.4)';
        ctx.shadowBlur  = 4*dpr;
        ctx.beginPath();
        ctx.roundRect(cx - TRW/2, fillTop, TRW, trackBot-fillTop, TRW/2);
        ctx.fillStyle = '#b2b2b2';
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      /* handle */
      ctx.beginPath();
      ctx.arc(cx, fillTop, HR, 0, Math.PI*2);
      ctx.fillStyle = v > 0.005 ? 'rgba(200,200,200,0.9)' : 'rgba(255,255,255,0.18)';
      ctx.shadowColor = 'rgba(200,200,200,0.5)';
      ctx.shadowBlur  = dragging.current ? 8*dpr : (v > 0.005 ? 5*dpr : 0);
      ctx.fill();
      ctx.shadowBlur = 0;

      rafRef.current = requestAnimationFrame(draw);
    };
    rafRef.current = requestAnimationFrame(draw);
    return () => { cancelAnimationFrame(rafRef.current); ro.disconnect(); };
  }, []);

  useEffect(() => {
    const onMove = (e) => {
      if (!dragging.current) return;
      volActual.current = getVal(e);
      onChangeCb.current(volActual.current);
    };
    const onUp = () => {
      if (!dragging.current) return;
      dragging.current = false;
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup',   onUp);
    return () => { document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); };
  }, [getVal]);

  return (
    <div ref={wrapRef} style={{flex:1, minHeight:0, cursor:'ns-resize', display:'flex', alignItems:'stretch'}}
      onMouseDown={e => { dragging.current = true; volActual.current = getVal(e); }}>
      <canvas ref={canvasRef} style={{display:'block'}}/>
    </div>
  );
}

/* ── Album Art ───────────────────────────────────────────────────────────── */
function AlbumArt({ track, isPlaying }) {
  return (
    <div style={{position:'relative', width:'100%', aspectRatio:'1', borderRadius:20, overflow:'hidden'}}>
      <div style={{
        position:'absolute', inset:-40, borderRadius:'50%', background:track.color,
        filter:'blur(56px)', opacity: isPlaying ? 0.48 : 0.24,
        transition:'opacity 1.4s ease',
        animation: isPlaying ? 'breathe 3.5s ease-in-out infinite' : 'none',
      }}/>
      <div style={{
        position:'absolute', inset:0, borderRadius:20,
        background:`linear-gradient(148deg, ${track.color}20 0%, #040408 100%)`,
        border:'1px solid rgba(255,255,255,0.06)',
        display:'flex', alignItems:'center', justifyContent:'center', overflow:'hidden',
      }}>
        {track.coverUrl ? (
          <img src={track.coverUrl} style={{position:'absolute',inset:0,width:'100%',height:'100%',objectFit:'cover'}}/>
        ) : (
          <>
            <svg width="100%" height="100%" viewBox="0 0 300 300" preserveAspectRatio="xMidYMid slice" style={{position:'absolute',inset:0}}>
              <defs>
                <radialGradient id={`rg${track.id}`} cx="38%" cy="32%" r="75%">
                  <stop offset="0%" stopColor={track.color} stopOpacity="0.65"/>
                  <stop offset="100%" stopColor="#040408" stopOpacity="1"/>
                </radialGradient>
              </defs>
              <rect width="300" height="300" fill={`url(#rg${track.id})`}/>
              {[68,105,138].map(r => (
                <circle key={r} cx="150" cy="150" r={r} fill="none"
                  stroke={`rgba(255,255,255,${r===68?0.06:r===105?0.035:0.02})`} strokeWidth="1"/>
              ))}
            </svg>
            <div style={{
              position:'relative', zIndex:1, width:38, height:38, borderRadius:'50%',
              border:`1.5px solid ${track.color}77`, boxShadow:`0 0 16px ${track.color}44`,
              animation: isPlaying ? 'spin 9s linear infinite' : 'none',
            }}/>
          </>
        )}
      </div>
    </div>
  );
}

/* ── MagBtn ──────────────────────────────────────────────────────────────── */
function MagBtn({ onClick, active, children, size=52, physics }) {
  const { ref, xy, onMove, onLeave } = useMagnet(0.28, physics || {});
  const [pressed, setPressed] = useState(false);
  return (
    <button ref={ref} onClick={onClick}
      onMouseMove={onMove} onMouseLeave={onLeave}
      onMouseDown={() => setPressed(true)} onMouseUp={() => setPressed(false)}
      style={{
        width:size, height:size, borderRadius:'50%', border:'none', background:'none',
        color: active ? 'var(--accent)' : 'rgba(255,255,255,0.38)',
        display:'flex', alignItems:'center', justifyContent:'center',
        cursor:'pointer', flexShrink:0,
        transform:`translate(${xy.x}px,${xy.y}px) scale(${pressed?0.83:1})`,
        transition: pressed ? 'transform 0.08s ease' : 'color 0.2s ease',
        willChange:'transform',
      }}>
      {children}
    </button>
  );
}

/* ── PlayBtn ─────────────────────────────────────────────────────────────── */
function PlayBtn({ isPlaying, onToggle, physics }) {
  const { ref, xy, onMove, onLeave } = useMagnet(0.18, physics || {});
  const [pressed, setPressed] = useState(false);
  return (
    <button ref={ref} onClick={onToggle}
      onMouseMove={onMove} onMouseLeave={onLeave}
      onMouseDown={() => setPressed(true)} onMouseUp={() => setPressed(false)}
      style={{
        width:66, height:66, borderRadius:'50%', border:'none',
        background: isPlaying ? 'rgba(178,178,178,0.11)' : 'rgba(255,255,255,0.05)',
        color:'var(--text)',
        display:'flex', alignItems:'center', justifyContent:'center',
        cursor:'pointer', flexShrink:0,
        transform:`translate(${xy.x}px,${xy.y}px) scale(${pressed?0.89:1})`,
        transition: pressed ? 'transform 0.09s ease' : 'background 0.3s ease, box-shadow 0.3s ease',
        boxShadow: isPlaying
          ? '0 0 22px rgba(178,178,178,0.1), inset 0 0 0 1px rgba(178,178,178,0.18)'
          : 'inset 0 0 0 1px rgba(255,255,255,0.07)',
        willChange:'transform',
      }}>
      {isPlaying
        ? <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
            <rect x="5" y="4" width="4.5" height="16" rx="2.25"/>
            <rect x="14.5" y="4" width="4.5" height="16" rx="2.25"/>
          </svg>
        : <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24" style={{marginLeft:2}}>
            <path d="M5 3.5 19.5 12 5 20.5z"/>
          </svg>
      }
    </button>
  );
}

/* ── NavIcon ─────────────────────────────────────────────────────────────── */
function NavIcon({ icon, label, active, onClick, size=38 }) {
  const { ref, xy, onMove, onLeave } = useMagnet(0.22);
  return (
    <button ref={ref} onClick={onClick} title={label}
      onMouseMove={onMove} onMouseLeave={onLeave}
      style={{
        width:size, height:size, borderRadius:11, border:'none',
        background: active ? 'rgba(178,178,178,0.11)' : 'none',
        color: active ? 'var(--accent)' : 'rgba(255,255,255,0.24)',
        display:'flex', alignItems:'center', justifyContent:'center',
        cursor:'pointer', flexShrink:0,
        transform:`translate(${xy.x}px,${xy.y}px)`,
        transition:'color 0.18s ease, background 0.18s ease',
        willChange:'transform',
      }}>
      {icon}
    </button>
  );
}

/* ── TrackRow ────────────────────────────────────────────────────────────── */
function TrackRow({ track, isActive, onClick }) {

/* ── VirtualTrackList ────────────────────────────────────────────────────── */
function VirtualTrackList({ items, activeId, onClickItem }) {
  const ROW_H  = 50;
  const BUFFER = 4;
  const ref    = useRef(null);
  const [scrollTop, setScrollTop] = useState(0);
  const [viewH,     setViewH]     = useState(500);

  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    setViewH(el.clientHeight);
    const ro = new ResizeObserver(() => setViewH(el.clientHeight));
    ro.observe(el);
    return () => ro.disconnect();
  }, []);

  const start = Math.max(0, Math.floor(scrollTop / ROW_H) - BUFFER);
  const end   = Math.min(items.length, Math.ceil((scrollTop + viewH) / ROW_H) + BUFFER);

  const activeIdx = items.findIndex(t => t.id === activeId);

  return (
    <div ref={ref} style={{flex:1, overflowY:'auto', padding:'2px 6px 10px', position:'relative'}}
      onScroll={e => setScrollTop(e.currentTarget.scrollTop)}>
      {activeIdx >= 0 && (
        <div style={{
          position:'absolute', pointerEvents:'none',
          top: activeIdx * ROW_H + 2, left:6, right:6, height: ROW_H - 2,
          borderRadius:9, background:'rgba(178,178,178,0.09)',
          transition:'top 0.42s cubic-bezier(0.22,1,0.36,1)',
          zIndex:0,
        }}/>
      )}
      <div style={{paddingTop: start * ROW_H, paddingBottom: (items.length - end) * ROW_H, position:'relative', zIndex:1}}>
        {items.slice(start, end).map(t => (
          <TrackRow key={t.id} track={t} isActive={t.id === activeId}
            onClick={() => onClickItem(t)}/>
        ))}
      </div>
    </div>
  );
}

/* ── Hero clone ──────────────────────────────────────────────────────────── */
function HeroClone({ hero, exiting, reverse = false }) {
  const { left: tLeft, top: tTop, size } = hero.targetRect;
  const { left: sLeft, top: sTop, width: sW, height: sH } = hero.startRect;

  const dx = (sLeft + sW/2) - (tLeft + size/2);
  const dy = (sTop + sH/2) - (tTop + size/2);
  const sc = sW / size;

  const [ready, setReady] = useState(false);
  useEffect(() => {
    requestAnimationFrame(() => requestAnimationFrame(() => setReady(true)));
  }, []);

  const gid = `hc${reverse ? 'r' : 'f'}${hero.track.id}`;
  const transform = ready
    ? (reverse ? `translate(${dx}px,${dy}px) scale(${sc})` : 'translate(0,0) scale(1)')
    : (reverse ? 'translate(0,0) scale(1)' : `translate(${dx}px,${dy}px) scale(${sc})`);

  return ReactDOM.createPortal(
    <div style={{
      position:'fixed',
      left: tLeft, top: tTop,
      width: size, height: size,
      borderRadius: 20,
      zIndex:960, pointerEvents:'none', overflow:'hidden',
      transformOrigin:'center center',
      transform,
      opacity: exiting ? 0 : 1,
      transition: ready ? 'transform 0.34s cubic-bezier(0.4,0,0.2,1), opacity 0.12s ease' : 'none',
    }}>
      <div style={{
        position:'absolute', inset:-40, borderRadius:'50%', background:hero.track.color,
        filter:'blur(56px)', opacity:0.24,
      }}/>
      <div style={{
        position:'absolute', inset:0, borderRadius:20,
        background:`linear-gradient(148deg, ${hero.track.color}20 0%, #040408 100%)`,
        border:'1px solid rgba(255,255,255,0.06)',
        display:'flex', alignItems:'center', justifyContent:'center', overflow:'hidden',
      }}>
        {hero.track.coverUrl ? (
          <img src={hero.track.coverUrl} style={{position:'absolute',inset:0,width:'100%',height:'100%',objectFit:'cover'}}/>
        ) : (
          <>
            <svg width="100%" height="100%" viewBox="0 0 300 300" preserveAspectRatio="xMidYMid slice" style={{position:'absolute',inset:0}}>
              <defs>
                <radialGradient id={gid} cx="38%" cy="32%" r="75%">
                  <stop offset="0%" stopColor={hero.track.color} stopOpacity="0.65"/>
                  <stop offset="100%" stopColor="#040408" stopOpacity="1"/>
                </radialGradient>
              </defs>
              <rect width="300" height="300" fill={`url(#${gid})`}/>
              {[68,105,138].map(r => (
                <circle key={r} cx="150" cy="150" r={r} fill="none"
                  stroke={`rgba(255,255,255,${r===68?0.06:r===105?0.035:0.02})`} strokeWidth="1"/>
              ))}
            </svg>
            <div style={{
              position:'relative', zIndex:1, width:38, height:38, borderRadius:'50%',
              border:`1.5px solid ${hero.track.color}77`, boxShadow:`0 0 16px ${hero.track.color}44`,
            }}/>
          </>
        )}
      </div>
    </div>,
    document.body
  );
}

/* ── CrossfadeSlider ─────────────────────────────────────────────────────── */
function CrossfadeSlider({ value, onChange }) {
  const trackRef    = useRef(null);
  const dragging    = useRef(false);
  const onChangeRef = useRef(onChange);
  onChangeRef.current = onChange;

  const calcVal = (clientX) => {
    const rect = trackRef.current.getBoundingClientRect();
    const x = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
    return Math.round(x * 12);
  };

  useEffect(() => {
    const move = (e) => { if (dragging.current) onChangeRef.current(calcVal(e.clientX)); };
    const up   = ()  => { dragging.current = false; };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
    return () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); };
  }, []);

  const pct = (value / 12) * 100;

  return (
    <div style={{display:'flex', alignItems:'center', gap:12}}>
      <div ref={trackRef}
        style={{width:130, height:20, display:'flex', alignItems:'center', cursor:'ew-resize', position:'relative', userSelect:'none'}}
        onMouseDown={e=>{ dragging.current=true; onChangeRef.current(calcVal(e.clientX)); e.preventDefault(); }}>
        <div style={{width:'100%', height:3, borderRadius:2, background:'rgba(255,255,255,0.1)', position:'relative'}}>
          <div style={{
            position:'absolute', left:0, top:0, height:'100%', borderRadius:2,
            width:`${pct}%`, background:'#9b7dff',
          }}/>
          <div style={{
            position:'absolute', top:'50%', left:`${pct}%`,
            transform:'translate(-50%,-50%)', pointerEvents:'none',
            width:13, height:13, borderRadius:'50%',
            background:'#fff', boxShadow:'0 1px 5px rgba(0,0,0,0.5)',
            border:'2px solid rgba(155,125,255,0.6)',
          }}/>
        </div>
      </div>
      <span style={{fontSize:12, color:'rgba(255,255,255,0.32)', minWidth:28, textAlign:'right'}}>
        {value === 0 ? 'выкл' : `${value} с`}
      </span>
    </div>
  );
}

  const [search,        setSearch]        = useState('');
  const [volume,        setVolume]        = useState(0.7);
  const [hero,               setHero]               = useState(null);
  const [playerVisible,      setPlayerVisible]      = useState(false);
  const [homeVisible,        setHomeVisible]        = useState(true);
  const [heroExiting,        setHeroExiting]        = useState(false);
  const [reverseHero,        setReverseHero]        = useState(null);
  const [reverseHeroExiting, setReverseHeroExiting] = useState(false);
  const [libCollapsed,  setLibCollapsed]  = useState(false);
  const [settings,      setSettings]      = useState({
    autoplay:false, crossfade:0, defaultRepeat:false,
    startWithWindows:false, minimizeToTray:false, musicFolder:'',
    customTitles: {},
  });
  const [sort,         setSort]         = useState('added');
  const [editingTitle, setEditingTitle] = useState(false);
  const [editValue,    setEditValue]    = useState('');
  const editCancelRef  = useRef(false);

  const customTitlesRef = useRef({});
  customTitlesRef.current = settings.customTitles || {};

  const artRefs       = useRef({});
  const playerArtRef  = useRef(null);
  const audioRef      = useRef(null);
  const handleNextRef  = useRef(null);
  const handlePrevRef  = useRef(null);
  const isPlayingRef   = useRef(false);
  const homeScrollRef  = useRef(null);
  isPlayingRef.current = isPlaying;
  const track = tracks[trackIdx] || tracks[0];

  /* загружаем настройки и треки при старте */
  useEffect(() => {
    (async () => {
      try {
        const saved = await window.electronAPI.loadSettings();
        if (saved && Object.keys(saved).length) {
          setSettings(s => ({ ...s, ...saved }));
          if (saved.musicFolder) {
            const local = await window.electronAPI.scanMusicFolder(saved.musicFolder);
            if (local.length > 0) {
              const ct = saved.customTitles || {};
              const withCustom = local.map(t => ct[t.path] ? { ...t, title: ct[t.path] } : t);
              setTracks(withCustom);
              loadCovers(withCustom);
            }
          }
        }
      } catch {}
    })();
  }, []);

  /* сохраняем настройки при изменении */
  useEffect(() => {
    try { window.electronAPI.saveSettings(settings); } catch {}
  }, [settings]);

  /* инициализация Audio */
  useEffect(() => {
    const audio = new Audio();
    audio.volume = volume;
    audioRef.current = audio;

    const onTime  = () => { if (audio.duration) setProgress(audio.currentTime / audio.duration); };
    const onEnded = () => handleNextRef.current?.();
    audio.addEventListener('timeupdate', onTime);
    audio.addEventListener('ended',      onEnded);

    return () => {
      audio.removeEventListener('timeupdate', onTime);
      audio.removeEventListener('ended',      onEnded);
      audio.pause();
      audio.src = '';
    };
  }, []);

  /* смена трека — обновляем src */
  useEffect(() => {
    const audio = audioRef.current;
    if (!audio || !track) return;
    if (track.path) {
      audio.src = 'file:///' + track.path.replace(/\\/g, '/');
      audio.load();
      audio.addEventListener('loadedmetadata', () => {
        const dur = Math.floor(audio.duration);
        if (dur) setTracks(prev => prev.map((t, i) => i === trackIdx ? { ...t, duration: dur } : t));
      }, { once: true });
      if (isPlayingRef.current) audio.play().catch(() => setIsPlaying(false));
    } else {
      audio.src = '';
    }
    setProgress(0);
  }, [trackIdx, track?.path]);

  /* play / pause */
  useEffect(() => {
    const audio = audioRef.current;
    if (!audio) return;
    if (isPlaying) audio.play().catch(() => setIsPlaying(false));
    else audio.pause();
  }, [isPlaying]);

  /* громкость */
  useEffect(() => {
    if (audioRef.current) audioRef.current.volume = volume;
  }, [volume]);

  /* медиаклавиши */
  useEffect(() => {
    const api = window.electronAPI;
    if (!api?.onMediaPlayPause) return;
    api.onMediaPlayPause(() => setIsPlaying(p => !p));
    api.onMediaNext(() => handleNextRef.current?.());
    api.onMediaPrev(() => handlePrevRef.current?.());
  }, []);

  function handleNext() {
    if (repeat === 'one') {
      const audio = audioRef.current;
      if (audio) { audio.currentTime = 0; audio.play().catch(() => {}); }
      setProgress(0); return;
    }
    if (shuffle) {
      setTrackIdx(i => { let n; do { n = Math.floor(Math.random()*tracks.length); } while (n === i && tracks.length > 1); return n; });
      setProgress(0); return;
    }
    const next = trackIdx + 1;
    if (next >= tracks.length) {
      if (repeat === 'all') { setTrackIdx(0); }
      else { setIsPlaying(false); }
    } else {
      setTrackIdx(next);
    }
    setProgress(0);
  }
  handleNextRef.current = handleNext;

  function handlePrev() {
    if (progress > 0.05) {
      setProgress(0);
      if (audioRef.current) audioRef.current.currentTime = 0;
      return;
    }
    setTrackIdx(i => (i - 1 + tracks.length) % tracks.length);
    setProgress(0);
  }
  handlePrevRef.current = handlePrev;

  const handleSeek = useCallback((v) => {
    setProgress(v);
    const audio = audioRef.current;
    if (audio?.duration) audio.currentTime = v * audio.duration;
  }, []);

  useEffect(() => { setEditingTitle(false); }, [trackIdx]);

  const commitEdit = () => {
    const trimmed = editValue.trim();
    if (trimmed) {
      setTracks(prev => prev.map((t, i) => i === trackIdx ? { ...t, title: trimmed } : t));
      const path = tracks[trackIdx]?.path;
      if (path) {
        setSettings(s => ({ ...s, customTitles: { ...s.customTitles, [path]: trimmed } }));
      }
    }
    setEditingTitle(false);
  };

  async function loadCovers(tracksArr) {
    const pending = tracksArr.filter(t => t.path);
    if (!pending.length) return;
    let next = 0;
    const acc = {};
    let newSinceFlush = 0;

    const flush = () => {
      if (!newSinceFlush) return;
      newSinceFlush = 0;
      const snap = { ...acc };
      setTracks(prev => prev.map(t => snap[t.id] ? { ...t, coverUrl: snap[t.id] } : t));
    };

    async function worker() {
      while (next < pending.length) {
        const t = pending[next++];
        try {
          const url = await window.electronAPI.getCoverArt(t.path);
          if (url) { acc[t.id] = url; newSinceFlush++; }
        } catch {}
        if (newSinceFlush >= 16) flush();
      }
    }

    await Promise.all(Array.from({ length: Math.min(16, pending.length) }, worker));
    flush();
  }

  const handleScanTracks = useCallback(async (folder) => {
    try {
      const local = await window.electronAPI.scanMusicFolder(folder);
      if (local.length > 0) {
        const ct = customTitlesRef.current;
        const withCustom = local.map(t => ct[t.path] ? { ...t, title: ct[t.path] } : t);
        setTracks(withCustom);
        setTrackIdx(0);
        setIsPlaying(false);
        setProgress(0);
        loadCovers(withCustom);
      }
    } catch {}
  }, []);

  function selectTrack(idx) {
    if (view === 'player') {
      setTrackIdx(idx); setProgress(0); setIsPlaying(true);
      return;
    }
    const artEl = artRefs.current[idx];
    const startRect = artEl ? artEl.getBoundingClientRect() : { left:0, top:0, width:0, height:0 };
    const par = playerArtRef.current?.getBoundingClientRect();
    const targetRect = par ? { left: par.left, top: par.top, size: par.width } : { left: 0, top: 0, size: 260 };

    setTrackIdx(idx); setProgress(0); setIsPlaying(true);
    setHero({ track: tracks[idx], startRect, targetRect });
    setHomeVisible(false);
    setPlayerVisible(true);
    setView('player');
    setNavActive('library');

    setTimeout(() => setHeroExiting(true), 300);
    setTimeout(() => { setHero(null); setHeroExiting(false); }, 420);
  }

  const sortedTracks = useMemo(() => {
    const arr = [...tracks];
    if (sort === 'artist')   arr.sort((a, b) => a.artist.localeCompare(b.artist) || a.title.localeCompare(b.title));
    else if (sort === 'title')    arr.sort((a, b) => a.title.localeCompare(b.title));
    else if (sort === 'duration') arr.sort((a, b) => (b.duration || 0) - (a.duration || 0));
    return arr;
  }, [tracks, sort]);

  const trackIdxMap = useMemo(() => {
    const m = new Map();
    tracks.forEach((t, i) => m.set(t.id, i));
    return m;
  }, [tracks]);

  const filtered = sortedTracks.filter(t =>
    t.title.toLowerCase().includes(search.toLowerCase()) ||
    t.artist.toLowerCase().includes(search.toLowerCase())
  );
  const elapsed = Math.floor(progress * (track?.duration || 0));

  const handleNav = (id) => {
    setNavActive(id);
    if (id === 'home') {
      if (view === 'player') {
        const artEl = artRefs.current[trackIdx];
        const par = playerArtRef.current?.getBoundingClientRect();
        if (artEl && par) {
          const cardRect  = artEl.getBoundingClientRect();
          const scrollEl  = homeScrollRef.current;
          let endTop = cardRect.top;

          if (scrollEl) {
            const box     = scrollEl.getBoundingClientRect();
            const visible = cardRect.top >= box.top && cardRect.bottom <= box.bottom;
            if (!visible) {
              const cardOffsetInScroll = cardRect.top - box.top + scrollEl.scrollTop;
              const targetTop = Math.max(0, cardOffsetInScroll - box.height / 2 + cardRect.height / 2);
              const delta     = targetTop - scrollEl.scrollTop;
              endTop = cardRect.top - delta;
              smoothScroll(scrollEl, targetTop, 340);
            }
          }

          setReverseHero({
            track: tracks[trackIdx],
            targetRect: { left: par.left, top: par.top, size: par.width },
            startRect:  { left: cardRect.left - 28, top: endTop, width: cardRect.width, height: cardRect.height },
          });
          setTimeout(() => setReverseHeroExiting(true), 300);
          setTimeout(() => { setReverseHero(null); setReverseHeroExiting(false); }, 420);
        }
        setPlayerVisible(false);
        setHomeVisible(true);
        setView('home');
      } else if (view === 'settings') {
        setHomeVisible(true);
        setView('home');
      }
    } else if (id === 'settings') {
      if (view === 'player') setPlayerVisible(false);
      if (view === 'home') setHomeVisible(false);
      setTimeout(() => setView('settings'), view === 'home' ? 240 : 300);
    } else if (view === 'home') {
      const artEl = artRefs.current[trackIdx];
      const par = playerArtRef.current?.getBoundingClientRect();
      if (artEl && par) {
        const startRect = artEl.getBoundingClientRect();
        const targetRect = { left: par.left, top: par.top, size: par.width };
        setHero({ track: tracks[trackIdx], startRect, targetRect });
        setTimeout(() => setHeroExiting(true), 300);
        setTimeout(() => { setHero(null); setHeroExiting(false); }, 420);
      }
      setHomeVisible(false);
      setPlayerVisible(true);
      setView('player');
    } else if (view === 'settings') {
      setPlayerVisible(true);
      setView('player');
    }
  };

  if (!track) return null;

  return (
    <div style={{display:'flex', width:'100%', height:'100%', overflow:'hidden'}}>
      {hero && hero.targetRect && <HeroClone hero={hero} exiting={heroExiting}/>}
      {reverseHero && reverseHero.targetRect && <HeroClone hero={reverseHero} exiting={reverseHeroExiting} reverse={true}/>}
      <Sidebar navActive={navActive} onNav={handleNav}
        libCollapsed={libCollapsed} onToggleLib={()=>setLibCollapsed(v=>!v)}
        inPlayer={view==='player'}/>

      <div style={{position:'relative', flex:1, height:'100%', overflow:'hidden'}}>

        {(
          <div ref={homeScrollRef} style={{
            position:'absolute', inset:0,
            overflowY:'auto', padding:'32px 36px',
            opacity: homeVisible ? 1 : 0,
            transform: homeVisible ? 'translateX(0)' : 'translateX(28px)',
            transition: homeVisible
              ? 'opacity 0.32s ease 0.08s, transform 0.48s cubic-bezier(0.22,1,0.36,1) 0.08s'
              : 'opacity 0.14s ease, transform 0.18s ease',
            pointerEvents: homeVisible ? 'auto' : 'none',
          }}>
            <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:24}}>
              <div style={{fontSize:12, fontWeight:500, color:'rgba(255,255,255,0.22)',
                letterSpacing:'0.06em', textTransform:'uppercase'}}>Все треки</div>
              <div style={{display:'flex', gap:3}}>
                {[['added','по дате'],['artist','по артисту'],['title','по названию'],['duration','по длине']].map(([k,label]) => (
                  <button key={k} onClick={() => setSort(k)} style={{
                    background: sort===k ? 'rgba(255,255,255,0.07)' : 'none',
                    border: '1px solid ' + (sort===k ? 'rgba(255,255,255,0.09)' : 'transparent'),
                    borderRadius:6, padding:'3px 9px',
                    fontSize:10, fontWeight:500, letterSpacing:'0.05em', textTransform:'uppercase',
                    color: sort===k ? 'rgba(255,255,255,0.5)' : 'rgba(255,255,255,0.2)',
                    cursor:'pointer', fontFamily:'Space Grotesk,sans-serif',
                    transition:'color 0.15s, background 0.15s, border-color 0.15s',
                  }}>{label}</button>
                ))}
              </div>
            </div>
            <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(128px, 1fr))', gap:18}}>
              {sortedTracks.map((t) => {
                const origIdx = trackIdxMap.get(t.id);
                return (
                  <HomeCard key={t.id} track={t}
                    artRef={el => artRefs.current[origIdx] = el}
                    onClick={() => selectTrack(origIdx)}
                    artHidden={reverseHero && !reverseHeroExiting && t.id === track.id}/>
                );
              })}
            </div>
          </div>
        )}

        {(
          <div style={{
            position:'absolute', inset:0, display:'flex',
            opacity: playerVisible ? 1 : 0,
            transition:'opacity 0.1s ease',
            pointerEvents: playerVisible ? 'auto' : 'none',
          }}>
        {/* library panel */}
        <div style={{
          width: libCollapsed ? 0 : 260,
          flexShrink:0, height:'100%',
          display:'flex', flexDirection:'column',
          borderRight: libCollapsed ? 'none' : '1px solid var(--border)',
          background:'rgba(255,255,255,0.014)',
          zIndex:9, overflow:'hidden',
          opacity: playerVisible ? 1 : 0,
          transform: playerVisible ? 'translateX(0)' : 'translateX(-28px)',
          transition: playerVisible
            ? 'opacity 0.32s ease 0.08s, transform 0.48s cubic-bezier(0.22,1,0.36,1) 0.08s, width 0.44s cubic-bezier(0.4,0,0.2,1), border 0.44s ease'
            : 'opacity 0.14s ease, transform 0.18s ease, width 0.44s cubic-bezier(0.4,0,0.2,1), border 0.44s ease',
        }}>
          <div style={{padding:'12px 10px 8px', flexShrink:0}}>
            <div style={{
              display:'flex', alignItems:'center', gap:7,
              background:'rgba(255,255,255,0.03)',
              border:'1px solid rgba(255,255,255,0.04)',
              borderRadius:8, padding:'6px 10px',
            }}>
              <svg width="11" height="11" fill="none" stroke="rgba(255,255,255,0.22)" strokeWidth="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/></svg>
              <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Поиск..."
                style={{flex:1, background:'none', border:'none', outline:'none',
                        color:'rgba(255,255,255,0.6)', fontSize:11.5, fontFamily:'Space Grotesk,sans-serif'}}/>
            </div>
          </div>
          <VirtualTrackList
            items={filtered}
            activeId={track.id}
            onClickItem={t => { setTrackIdx(tracks.indexOf(t)); setProgress(0); setIsPlaying(true); }}
          />
        </div>

        {/* center player */}
        <div style={{
          flex:1, minWidth:0, height:'100%',
          display:'flex', alignItems:'center', justifyContent:'center',
        }}>
          <div style={{
            width:'min(calc(100% - 64px), calc(100vh - 320px))',
            maxWidth:480, minWidth:220,
            display:'flex', flexDirection:'column',
            alignItems:'center', gap:0,
          }}>
            <div id="player-album-art" ref={playerArtRef} style={{width:'100%', marginBottom:22, opacity: ((hero && !heroExiting) || reverseHero) ? 0 : 1}}>
              <AlbumArt track={track} isPlaying={isPlaying}/>
            </div>
            <div style={{
              textAlign:'center', marginBottom:18, width:'100%',
              transform: playerVisible ? 'translateY(0)' : 'translateY(10px)',
              transition: playerVisible
                ? 'transform 0.48s cubic-bezier(0.22,1,0.36,1) 0.12s'
                : 'transform 0.15s ease',
            }}>
              {editingTitle ? (
                <div style={{display:'flex', justifyContent:'center', width:'100%'}}>
                  <div style={{
                    display:'inline-flex', alignItems:'center',
                    background:'rgba(255,255,255,0.055)',
                    border:'1px solid rgba(255,255,255,0.11)',
                    borderRadius:11, padding:'7px 18px',
                    boxShadow:'0 4px 28px rgba(0,0,0,0.45)',
                    maxWidth:'100%',
                  }}>
                    <input
                      autoFocus
                      value={editValue}
                      onChange={e => setEditValue(e.target.value)}
                      onKeyDown={e => {
                        if (e.key === 'Enter')  { editCancelRef.current = false; commitEdit(); }
                        if (e.key === 'Escape') { editCancelRef.current = true;  setEditingTitle(false); }
                      }}
                      onBlur={() => { if (!editCancelRef.current) commitEdit(); editCancelRef.current = false; }}
                      style={{
                        background:'none', border:'none', outline:'none',
                        fontSize:22, fontWeight:600, letterSpacing:'-0.022em',
                        color:'#ededf4', textAlign:'center',
                        fontFamily:'Space Grotesk,sans-serif',
                        width: Math.max(80, editValue.length * 13) + 'px',
                        maxWidth:'100%',
                      }}
                    />
                  </div>
                </div>
              ) : (
                <div
                  onClick={e => { if (e.shiftKey) { editCancelRef.current = false; setEditValue(track.title); setEditingTitle(true); } }}
                  style={{
                    fontSize:22, fontWeight:600, letterSpacing:'-0.022em',
                    whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis',
                    opacity: playerVisible ? 1 : 0,
                    transition: playerVisible ? 'opacity 0.36s ease 0.12s' : 'opacity 0.1s ease',
                  }}>{track.title}</div>
              )}
              <div style={{
                fontSize:12, color:'rgba(255,255,255,0.28)', marginTop:4,
                opacity: playerVisible ? 1 : 0,
                transition: playerVisible ? 'opacity 0.36s ease 0.2s' : 'opacity 0.1s ease',
              }}>{track.artist}</div>
            </div>
            <div style={{width:'100%', marginBottom:20}}>
              <WaveProgressBar progress={progress} elapsed={elapsed} total={track.duration || 0}
                onSeek={handleSeek} isPlaying={isPlaying}/>
            </div>
            {(()=>{ const P = { spring:0.055, damping:0.84, clamp:10 }; return (
            <div style={{display:'flex', alignItems:'center', gap:8, justifyContent:'center'}}>
              <MagBtn onClick={()=>setShuffle(s=>!s)} active={shuffle} size={48} physics={P}>
                <svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24">
                  <path d="M3 17h2.5C7.5 17 9.5 15.5 12 12s4.5-5 6.5-5H21"/>
                  <polyline points="18 5 21 7 18 9"/>
                  <path d="M3 7h2.5C7.5 7 9 8.3 10.8 10.4"/>
                  <path d="M13.2 13.6C15 15.7 16.5 17 18.5 17H21"/>
                  <polyline points="18 15 21 17 18 19"/>
                </svg>
              </MagBtn>
              <MagBtn onClick={handlePrev} size={54} physics={P}>
                <svg width="21" height="21" fill="currentColor" viewBox="0 0 24 24">
                  <rect x="4" y="4.5" width="3.5" height="15" rx="1.75"/>
                  <path d="M9.5 12 19 5.5v13z"/>
                </svg>
              </MagBtn>
              <PlayBtn isPlaying={isPlaying} onToggle={()=>setIsPlaying(p=>!p)} physics={P}/>
              <MagBtn onClick={handleNext} size={54} physics={P}>
                <svg width="21" height="21" fill="currentColor" viewBox="0 0 24 24">
                  <path d="M14.5 12 5 5.5v13z"/>
                  <rect x="16.5" y="4.5" width="3.5" height="15" rx="1.75"/>
                </svg>
              </MagBtn>
              <MagBtn onClick={()=>setRepeat(r=>r==='off'?'all':r==='all'?'one':'off')} active={repeat!=='off'} size={48} physics={P}>
                <div style={{position:'relative', display:'flex', alignItems:'center', justifyContent:'center'}}>
                  <svg width="19" height="19" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24">
                    <path d="M17 2l4 4-4 4"/>
                    <path d="M3 11V9a5 5 0 0 1 5-5h13"/>
                    <path d="M7 22l-4-4 4-4"/>
                    <path d="M21 13v2a5 5 0 0 1-5 5H3"/>
                  </svg>
                  {repeat==='one' && <span style={{
                    position:'absolute', top:-6, right:-8,
                    background:'var(--accent)', color:'#07070a',
                    fontSize:7.5, fontWeight:700, lineHeight:1,
                    padding:'2px 4px', borderRadius:4,
                  }}>1</span>}
                </div>
              </MagBtn>
            </div>
            ); })()}
          </div>
        </div>

        {/* volume panel */}
        <div style={{
          width:28, flexShrink:0, height:'100%',
          display:'flex', flexDirection:'column', alignItems:'center',
          paddingTop:80, paddingBottom:80, paddingRight:5,
        }}>
          <ThinVolumeSlider volume={volume} onChange={setVolume}/>
        </div>
          </div>
        )}

        <SettingsView settings={settings} onSettings={setSettings} visible={view==='settings'} onScanTracks={handleScanTracks}/>

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
