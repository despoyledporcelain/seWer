function smoothScroll(el, targetTop, duration) {
  const startTop = el.scrollTop;
  const delta    = targetTop - startTop;
  if (!delta) return;
  const t0 = performance.now();
  function ease(x) { return x < 0.5 ? 2*x*x : 1 - Math.pow(-2*x + 2, 2)/2; }
  function tick(now) {
    const p = Math.min((now - t0) / duration, 1);
    el.scrollTop = startTop + delta * ease(p);
    if (p < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}


function fmt(s) {
  const m = Math.floor(s/60), sec = Math.floor(s%60);
  return `${m}:${sec.toString().padStart(2,'0')}`;
}

function scHashColor(id) {
  let h = 0; const s = String(id);
  for (const c of s) h = ((h << 5) - h + c.charCodeAt(0)) | 0;
  return `hsl(${Math.abs(h) % 360},48%,38%)`;
}


/* ── Wave Progress Bar ───────────────────────────────────────────────────── */
function WaveProgressBar({ progress, elapsed, total, onSeek, isPlaying, visible }) {
  const wrapRef    = useRef(null);
  const canvasRef  = useRef(null);
  const rafRef     = useRef(null);
  const progRef    = useRef(progress);
  const dispProg   = useRef(progress);
  const playRef    = useRef(isPlaying);
  const dragging   = useRef(false);
  const pendingSize = useRef(null);
  const accT       = useRef(0);
  const lastNow    = useRef(null);
  const visibleRef = useRef(visible);
  const drawFnRef  = useRef(null);
  const elapsedSpanRef   = useRef(null);
  const remainingSpanRef = useRef(null);
  const totalRef   = useRef(total);
  totalRef.current = total;
  const H = 52;

  useEffect(() => { progRef.current = progress; }, [progress]);
  useEffect(() => { playRef.current = isPlaying; }, [isPlaying]);

  useEffect(() => {
    visibleRef.current = visible;
    if (visible && drawFnRef.current && !rafRef.current) {
      lastNow.current = null;
      rafRef.current = requestAnimationFrame(drawFnRef.current);
    } else if (!visible) {
      cancelAnimationFrame(rafRef.current);
      rafRef.current = null;
    }
  }, [visible]);

  useEffect(() => {
    const canvas = canvasRef.current, wrap = wrapRef.current;
    if (!canvas || !wrap) return;
    const dpr = window.devicePixelRatio || 1;
    canvas.width  = Math.round(wrap.clientWidth * dpr);
    canvas.height = Math.round(H * dpr);
    const resize = () => {
      const nW = Math.round(wrap.clientWidth * dpr), nH = Math.round(H * dpr);
      if (canvas.width !== nW || canvas.height !== nH) pendingSize.current = { w: nW, h: nH };
    };
    const ro = new ResizeObserver(resize);
    ro.observe(wrap);

    const draw = (now) => {
      if (pendingSize.current) {
        canvas.width  = pendingSize.current.w;
        canvas.height = pendingSize.current.h;
        pendingSize.current = null;
      }
      if (playRef.current && lastNow.current !== null)
        accT.current += (now - lastNow.current) * 0.001;
      lastNow.current = now;
      const t = accT.current;

      const ctx = canvas.getContext('2d');
      const W = canvas.width, HH = canvas.height;
      ctx.clearRect(0, 0, W, HH);

      dispProg.current += (progRef.current - dispProg.current) * 0.12;
      const p   = dispProg.current;
      const barH = 5 * dpr;
      const r    = barH / 2;
      const cy   = HH * 0.5;
      const freq = 0.020/dpr, freq2 = 0.038/dpr;
      const step = Math.max(1, Math.round(dpr));

      const pts = [];
      for (let x = 0; x <= W; x += step) {
        const nx  = x / W;
        const env = Math.min(nx/0.04, (1-nx)/0.04, 1) * Math.exp(-Math.pow((nx-0.5)*2.4, 2));
        const a   = HH * 0.18 * env;
        pts.push({ x, y: cy + a*Math.sin(x*freq - t*1.4) + a*0.38*Math.sin(x*freq2 - t*0.9 + 1.8) });
      }

      /* bg track */
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y - r);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y - r);
      for (let i = pts.length - 1; i >= 0; i--) ctx.lineTo(pts[i].x, pts[i].y + r);
      ctx.closePath();
      ctx.fillStyle = 'rgba(255,255,255,0.07)';
      ctx.fill();

      /* fill */
      if (p > 0.005) {
        const piX = Math.min(Math.round(p * W / step), pts.length - 1);
        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y - r);
        for (let i = 1; i <= piX; i++) ctx.lineTo(pts[i].x, pts[i].y - r);
        ctx.arc(pts[piX].x, pts[piX].y, r, -Math.PI/2, Math.PI/2, false);
        for (let i = piX; i >= 0; i--) ctx.lineTo(pts[i].x, pts[i].y + r);
        ctx.closePath();
        ctx.shadowColor = 'rgba(178,178,178,0.5)';
        ctx.shadowBlur  = 8 * dpr;
        ctx.fillStyle   = '#c8c8c8';
        ctx.fill();
        ctx.shadowBlur  = 0;
      }

      const dur = totalRef.current || 0;
      const de = Math.floor(dispProg.current * dur);
      if (elapsedSpanRef.current)   elapsedSpanRef.current.textContent   = fmt(de);
      if (remainingSpanRef.current) remainingSpanRef.current.textContent = '-' + fmt(dur - de);

      if (!visibleRef.current) { rafRef.current = null; return; }
      rafRef.current = requestAnimationFrame(draw);
    };
    drawFnRef.current = draw;
    if (visibleRef.current) rafRef.current = requestAnimationFrame(draw);
    return () => { cancelAnimationFrame(rafRef.current); rafRef.current = null; ro.disconnect(); };
  }, []);

  const getVal = (e) => {
    const rect = canvasRef.current.getBoundingClientRect();
    return Math.max(0, Math.min(1, (e.clientX - rect.left)/rect.width));
  };
  useEffect(() => {
    const onMove = (e) => { if (dragging.current) onSeek(getVal(e)); };
    const onUp   = () => { dragging.current = false; };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup',   onUp);
    return () => { document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); };
  }, [onSeek]);

  const timeStyle = {
    fontSize: 10, fontVariantNumeric: 'tabular-nums',
    color: 'rgba(255,255,255,0.22)', letterSpacing: '0.02em',
    userSelect: 'none', flexShrink: 0,
  };
  return (
    <div style={{width:'100%', display:'flex', alignItems:'center', gap:9}}>
      <span ref={elapsedSpanRef} style={timeStyle}>{fmt(elapsed)}</span>
      <div ref={wrapRef} style={{flex:1, minWidth:0, overflow:'hidden', cursor:'pointer',
        WebkitMaskImage:'linear-gradient(to right, transparent, black 20px, black calc(100% - 20px), transparent)',
        maskImage:'linear-gradient(to right, transparent, black 20px, black calc(100% - 20px), transparent)',
      }} onMouseDown={e => { dragging.current = true; onSeek(getVal(e)); }}>
        <canvas ref={canvasRef} style={{display:'block', width:'100%', height:H+'px'}}/>
      </div>
      <span ref={remainingSpanRef} style={timeStyle}>-{fmt(total - elapsed)}</span>
    </div>
  );
}

/* ── Thin Volume Slider ───────────────────────────────────────────────────── */
function ThinVolumeSlider({ volume, onChange }) {
  const wrapRef    = useRef(null);
  const canvasRef  = useRef(null);
  const rafRef     = useRef(null);
  const volActual  = useRef(volume); /* follows props when idle, follows cursor during drag */
  const volDisp    = useRef(volume); /* smoothly chases volActual */
  const dragging   = useRef(false);
  const trackWAnim = useRef(2);      /* animates between 2 and 4 on press */
  const handleRAnim= useRef(3.5);
  const onChangeCb = useRef(onChange);
  const TW = 28;

  useEffect(() => { onChangeCb.current = onChange; }, [onChange]);
  useEffect(() => { if (!dragging.current) volActual.current = volume; }, [volume]);

  const getVal = useCallback((e) => {
    const rect = canvasRef.current.getBoundingClientRect();
    return Math.max(0, Math.min(1, 1 - (e.clientY - rect.top)/rect.height));
  }, []);

  useEffect(() => {
    const canvas = canvasRef.current, wrap = wrapRef.current;
    if (!canvas || !wrap) return;
    const dpr = window.devicePixelRatio || 1;

    const resize = () => {
      canvas.height = wrap.clientHeight * dpr;
      canvas.width  = TW * dpr;
      canvas.style.height = wrap.clientHeight + 'px';
      canvas.style.width  = TW + 'px';
    };
    resize();
    const ro = new ResizeObserver(resize);
    ro.observe(wrap);

    const draw = () => {
      const speed = dragging.current ? 0.09 : 0.04;
      volDisp.current += (volActual.current - volDisp.current) * speed;
      const v = volDisp.current;

      const ctx = canvas.getContext('2d');
      const WW = canvas.width, HH = canvas.height;
      ctx.clearRect(0, 0, WW, HH);

      const cx    = WW / 2;
      const barW  = 5 * dpr;
      const r     = barW / 2;
      const pad   = r + 4 * dpr;
      const trackH = HH - pad * 2;
      const trackTop = pad;
      const trackBot = pad + trackH;

      /* bg track */
      ctx.beginPath();
      ctx.roundRect(cx - r, trackTop, barW, trackH, r);
      ctx.fillStyle = 'rgba(255,255,255,0.07)';
      ctx.fill();

      /* fill */
      if (v > 0.01) {
        const fillH   = Math.max(barW, trackH * v);
        const fillTop = trackBot - fillH;
        ctx.save();
        ctx.shadowColor = 'rgba(178,178,178,0.5)';
        ctx.shadowBlur  = 8 * dpr;
        ctx.beginPath();
        ctx.roundRect(cx - r, fillTop, barW, fillH, r);
        ctx.fillStyle = '#c8c8c8';
        ctx.fill();
        ctx.restore();
      }

      rafRef.current = requestAnimationFrame(draw);
    };
    rafRef.current = requestAnimationFrame(draw);
    return () => { cancelAnimationFrame(rafRef.current); ro.disconnect(); };
  }, []);

  useEffect(() => {
    const onMove = (e) => {
      if (!dragging.current) return;
      volActual.current = getVal(e);
      onChangeCb.current(volActual.current);
    };
    const onUp = () => {
      if (!dragging.current) return;
      dragging.current = false;
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup',   onUp);
    return () => { document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); };
  }, [getVal]);

  return (
    <div ref={wrapRef} style={{flex:1, minHeight:0, cursor:'ns-resize', display:'flex', alignItems:'stretch'}}
      onMouseDown={e => { dragging.current = true; volActual.current = getVal(e); }}>
      <canvas ref={canvasRef} style={{display:'block'}}/>
    </div>
  );
}

/* ── Album Art ───────────────────────────────────────────────────────────── */
function AlbumArt({ track, isPlaying }) {
  if (track.coverUrl) {
    return (
      <div style={{position:'relative',width:'100%',aspectRatio:'1',borderRadius:20,overflow:'hidden'}}>
        <img src={track.coverUrl} style={{position:'absolute',inset:0,width:'100%',height:'100%',objectFit:'cover'}}
          onError={e=>{e.currentTarget.style.display='none'}}/>
      </div>
    );
  }
  return (
    <div style={{
      position:'relative',width:'100%',aspectRatio:'1',borderRadius:20,overflow:'hidden',
      background:'#111116',
      display:'flex',alignItems:'center',justifyContent:'center',
    }}>
      <img src="../assets/note.png" style={{width:32,height:32,filter:'brightness(0) invert(1)',opacity:0.13}}/>
    </div>

/* ── TrackList ───────────────────────────────────────────────────────────── */
function VirtualTrackList({ items, activeId, loadingId, errorId, onClickItem, scrollToActive, scrollTargetId }) {
  const ROW_H = 50;
  const ref   = useRef(null);

  useEffect(() => {
    if (!scrollToActive || !ref.current) return;
    const targetId = scrollTargetId ?? activeId;
    const idx = items.findIndex(t => t.id === targetId);
    if (idx < 0) return;
    const el = ref.current;
    smoothScroll(el, Math.max(0, idx * ROW_H - el.clientHeight / 2 + ROW_H / 2), 420);
  }, [scrollToActive]);

  const onClickStable = useCallback(t => onClickItem(t), [onClickItem]);

  const activeIdx = items.findIndex(t => t.id === activeId);

  return (
    <div ref={ref} className="scroll-thin" style={{flex:1, overflowY:'auto', padding:'2px 6px 10px', position:'relative', willChange:'transform'}}>
      {activeIdx >= 0 && (
        <div style={{
          position:'absolute', pointerEvents:'none',
          top: activeIdx * ROW_H + 2, left:6, right:6, height: ROW_H - 2,
          borderRadius:9, background:'rgba(178,178,178,0.09)',
          transition:'top 0.42s cubic-bezier(0.22,1,0.36,1)',
          zIndex:0,
        }}/>
      )}
      <div style={{position:'relative', zIndex:1}}>
        {items.map(t => (
          <TrackRow key={t.id} track={t} isActive={t.id === activeId}
            isLoading={t.id === loadingId}
            isError={t.id === errorId}
            onClick={() => onClickStable(t)}/>
        ))}
      </div>
    </div>
  );
}

/* ── Hero clone ──────────────────────────────────────────────────────────── */
function HeroClone({ hero, exiting, reverse = false }) {
  const { left: tLeft, top: tTop, size } = hero.targetRect;
  const { left: sLeft, top: sTop, width: sW, height: sH } = hero.startRect;

  const dx = (sLeft + sW/2) - (tLeft + size/2);
  const dy = (sTop + sH/2) - (tTop + size/2);
  const sc = sW / size;

  const startBR = reverse ? 20 : 16;
  const endBR   = reverse ? 16 : 20;

  const [ready, setReady] = useState(false);
  useEffect(() => {
    requestAnimationFrame(() => requestAnimationFrame(() => setReady(true)));
  }, []);

  const transform = ready
    ? (reverse ? `translate(${dx}px,${dy}px) scale(${sc})` : 'translate(0,0) scale(1)')
    : (reverse ? 'translate(0,0) scale(1)' : `translate(${dx}px,${dy}px) scale(${sc})`);

  return ReactDOM.createPortal(
    <div style={{
      position:'fixed',
      left: tLeft, top: tTop,
      width: size, height: size,
      borderRadius: ready ? endBR : startBR,
      zIndex:960, pointerEvents:'none', overflow:'hidden',
      transformOrigin:'center center',
      transform,
      opacity: exiting ? 0 : 1,
      transition: ready ? 'transform 0.34s cubic-bezier(0.4,0,0.2,1), border-radius 0.34s cubic-bezier(0.4,0,0.2,1), opacity 0.12s ease' : 'none',
    }}>
      <div style={{
        position:'absolute', inset:0, borderRadius:20,
        background:'#111116',
        display:'flex', alignItems:'center', justifyContent:'center', overflow:'hidden',
      }}>
        {hero.track.coverUrl ? (
          <img src={hero.track.coverUrl} style={{position:'absolute',inset:0,width:'100%',height:'100%',objectFit:'cover'}}
            onError={e=>{e.currentTarget.style.display='none'}}/>
        ) : (
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none">
            <path d="M9 18V5l12-2v13" stroke="rgba(255,255,255,0.13)" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
            <circle cx="6" cy="18" r="3" stroke="rgba(255,255,255,0.13)" strokeWidth="1.5"/>
            <circle cx="18" cy="16" r="3" stroke="rgba(255,255,255,0.13)" strokeWidth="1.5"/>
          </svg>
        )}
      </div>
    </div>,
    document.body
  );
}

/* ── CrossfadeSlider ─────────────────────────────────────────────────────── */
function CrossfadeSlider({ value, onChange }) {
  const trackRef    = useRef(null);
  const onChangeRef = useRef(onChange);
  const valueRef    = useRef(value);
  onChangeRef.current = onChange;
  valueRef.current    = value;

  const calcVal = (clientX) => {
    const rect = trackRef.current.getBoundingClientRect();
    return Math.round(Math.max(0, Math.min(1, (clientX - rect.left) / rect.width)) * 12);
  };

  useEffect(() => {
    const el = trackRef.current;
    const onWheel = e => {
      e.preventDefault();
      onChangeRef.current(Math.max(0, Math.min(12, valueRef.current + (e.deltaY > 0 ? -1 : 1))));
    };
    el.addEventListener('wheel', onWheel, { passive: false });
    return () => el.removeEventListener('wheel', onWheel);
  }, []);

  const pct = ((value || 0) / 12) * 100;

  return (
    <div style={{display:'flex', alignItems:'center', gap:12}}>
      <div ref={trackRef}
        style={{width:150, height:24, display:'flex', alignItems:'center', cursor:'ew-resize', userSelect:'none', touchAction:'none'}}
        onPointerDown={e => {
          e.currentTarget.setPointerCapture(e.pointerId);
          onChangeRef.current(calcVal(e.clientX));
        }}
        onPointerMove={e => {
          if (!e.currentTarget.hasPointerCapture(e.pointerId)) return;
          onChangeRef.current(calcVal(e.clientX));
        }}
        onPointerUp={e => {
          e.currentTarget.releasePointerCapture(e.pointerId);
        }}>
        <div style={{width:'100%', height:6, borderRadius:3, background:'rgba(255,255,255,0.07)', position:'relative', overflow:'hidden'}}>
          <div style={{
            position:'absolute', left:0, top:0, height:'100%',
            width:`${pct}%`, borderRadius:3,
            background:'#c8c8c8',
            boxShadow: pct > 0 ? '0 0 8px rgba(178,178,178,0.45)' : 'none',
          }}/>
        </div>
      </div>
      <span style={{fontSize:12, color:'rgba(255,255,255,0.32)', minWidth:28, textAlign:'right'}}>
        {value === 0 ? 'выкл' : `${value} с`}
      </span>
    </div>
  );
}

/* ── AvatarFlyClone ──────────────────────────────────────────────────────── */
function AvatarFlyClone({ fly, exiting }) {
  const { avatarUrl, startRect: s, targetRect: t } = fly;
  const dx = (s.left + s.width/2)  - (t.left + t.width/2);
  const dy = (s.top  + s.height/2) - (t.top  + t.height/2);
  const sc = s.width / t.width;
  const [ready, setReady] = useState(false);
  useEffect(() => { requestAnimationFrame(() => requestAnimationFrame(() => setReady(true))); }, []);
  return ReactDOM.createPortal(
    <div style={{
      position:'fixed', left:t.left, top:t.top,
      width:t.width, height:t.height, borderRadius:12,
      overflow:'hidden', zIndex:970, pointerEvents:'none',
      transformOrigin:'center center',
      transform: ready ? 'translate(0,0) scale(1)' : `translate(${dx}px,${dy}px) scale(${sc})`,
      opacity: exiting ? 0 : 1,
      transition: ready ? 'transform 0.38s cubic-bezier(0.22,1,0.36,1), opacity 0.12s ease' : 'none',
    }}>
      <img src={avatarUrl} style={{width:'100%',height:'100%',objectFit:'cover'}}/>
    </div>,
    document.body
  );
}

/* ── SoundCloudView ──────────────────────────────────────────────────────── */
function SoundCloudView({ visible, scAuth, onLogin, onLogout, avatarRef }) {
  const [loading, setLoading] = useState(false);
  const [error,   setError]   = useState(null);

  const handleLogin = async () => {
    setLoading(true); setError(null);
    try {
      const creds = await window.electronAPI.scLogin();
      if (!creds) { setLoading(false); return; }
      const res = await window.electronAPI.scFetch('https://api-v2.soundcloud.com/me', creds.token, creds.clientId);
      if (res.data) onLogin({ ...creds, userId: res.data.id, username: res.data.username, avatarUrl: res.data.avatar_url || null });
      else setError('не удалось получить данные профиля');
    } catch { setError('ошибка подключения'); }
    setLoading(false);
  };

  const SC_ICON = <SoundCloudIcon size={40} fill="rgba(255,100,20,0.65)"/>;

  const transStyle = {
    position:'absolute', inset:0,
    opacity: visible ? 1 : 0,
    transform: visible ? 'none' : 'translateY(8px)',

        <div style={{textAlign:'center'}}>
          <div style={{fontSize:11, color:'rgba(255,255,255,0.28)', letterSpacing:'0.08em', textTransform:'uppercase', marginBottom:8}}>signed as</div>
          <div style={{fontSize:20, fontWeight:600, letterSpacing:'-0.02em', color:'rgba(255,255,255,0.85)'}}>{scAuth.username || 'неизвестно'}</div>
        </div>
        <button onClick={onLogout} style={{
          background:'rgba(255,255,255,0.04)',
          borderRadius:9, padding:'7px 18px', marginTop:8,
          fontSize:12, fontWeight:500, color:'rgba(255,255,255,0.5)',
          cursor:'pointer', fontFamily:'inherit',
          transition:'background 0.15s, color 0.15s, border-color 0.15s',
        }}
          onMouseEnter={e=>{ e.currentTarget.style.background='rgba(255,255,255,0.07)'; e.currentTarget.style.color='rgba(255,255,255,0.75)'; }}
          onMouseLeave={e=>{ e.currentTarget.style.background='rgba(255,255,255,0.04)'; e.currentTarget.style.color='rgba(255,255,255,0.5)'; }}
        >выйти</button>
      </div>
    </div>
  );

  return (
    <div style={{...transStyle, display:'flex', alignItems:'center', justifyContent:'center'}}>
      <div style={{display:'flex', flexDirection:'column', alignItems:'center', gap:20}}>
        <div ref={avatarRef} style={{
          width:72, height:72, borderRadius:20, flexShrink:0,
          background:'rgba(255,85,0,0.07)',
          display:'flex', alignItems:'center', justifyContent:'center', overflow:'hidden',
        }}>
          {SC_ICON}
        </div>
        <div style={{textAlign:'center'}}>
          <div style={{fontSize:15,fontWeight:600,letterSpacing:'-0.015em',color:'rgba(255,255,255,0.6)',marginBottom:7}}>soundcloud не подключён</div>
          <div style={{fontSize:12,color:'rgba(255,255,255,0.22)',lineHeight:1.6}}>войди чтобы видеть лайки,<br/>артистов и подписки</div>

/* ── SearchView ──────────────────────────────────────────────────────────── */
const SearchView = React.forwardRef(function SearchView({ visible, scAuth, likedIds, onLike, onPlayTrack, onSelectTrack }, ref) {
  const inputRef = useRef(null);
  React.useImperativeHandle(ref, () => ({ focus: () => { inputRef.current?.focus(); inputRef.current?.select(); } }));
  const [query,   setQuery]   = useState('');
  const [results, setResults] = useState([]);
  const [users,   setUsers]   = useState([]);
  const [loading, setLoading] = useState(false);
  const [offset,  setOffset]  = useState(0);
  const [hasMore, setHasMore] = useState(false);
  const debounceRef = useRef(null);
  const queryRef    = useRef('');
  const loadingRef  = useRef(false);

  const hasResults = results.length > 0 || users.length > 0;

  const doSearch = async (q, off = 0) => {
    if (!q.trim() || !scAuth) return;
    loadingRef.current = true;
    setLoading(true);
    const [tracksRes, usersRes] = await Promise.all([
      window.electronAPI.scFetch(
        `https://api-v2.soundcloud.com/search/tracks?q=${encodeURIComponent(q)}&limit=20&offset=${off}`,
        scAuth.token, scAuth.clientId
      ),
      off === 0
        ? window.electronAPI.scFetch(
            `https://api-v2.soundcloud.com/search/users?q=${encodeURIComponent(q)}&limit=4`,
            scAuth.token, scAuth.clientId
          )
        : Promise.resolve(null),
    ]);
    if (queryRef.current !== q) return;
    const newTracks = (tracksRes.data?.collection || []).map(t => ({
      id: t.id,
      title: t.title || 'Без названия',
      artist: t.publisher_metadata?.artist || t.user?.username || '',
      duration: Math.floor((t.duration || 0) / 1000),
      color: scHashColor(t.id),
      coverUrl: t.artwork_url ? t.artwork_url.replace('-large', '-t500x500') : null,
      streamUrl: t.media?.transcodings?.find(tc => tc.format?.protocol === 'progressive')?.url || null,
      hlsUrl: t.media?.transcodings?.find(tc => tc.format?.protocol === 'hls')?.url || null,
    }));
    if (off === 0) {
      setResults(newTracks);
      setUsers((usersRes?.data?.collection || []).map(u => ({
        id: u.id, username: u.username,
        avatarUrl: u.avatar_url,
        followersCount: u.followers_count,
      })));
    } else {
      setResults(prev => [...prev, ...newTracks]);
    }
    setHasMore(!!tracksRes.data?.next_href);
    setOffset(off + 20);
    loadingRef.current = false;
    setLoading(false);
  };

  const handleInput = e => {
    const q = e.target.value;
    setQuery(q);
    queryRef.current = q;
    clearTimeout(debounceRef.current);
    if (!q.trim()) { setResults([]); setUsers([]); setOffset(0); return; }
    debounceRef.current = setTimeout(() => doSearch(q, 0), 380);
  };

  const handleScroll = e => {
    if (!hasMore || loadingRef.current) return;
    const el = e.currentTarget;
    if (el.scrollTop + el.clientHeight >= el.scrollHeight - 120) doSearch(query, offset);
  };

  return (
    <div style={{
      position:'absolute', inset:0,
      opacity: visible ? 1 : 0,
      pointerEvents: visible ? 'auto' : 'none',
      transition:'opacity 0.14s ease',
    }}>
      {/* searchbar */}
      <div style={{
        position:'absolute', left:0, right:0,
        top: hasResults ? '8%' : '36%',
        transition:'top 0.42s cubic-bezier(0.22,1,0.36,1)',
        padding:'0 52px', zIndex:2,
      }}>
        <div style={{
          display:'flex', alignItems:'center', gap:14,
          background:'rgba(255,255,255,0.05)',
          borderRadius:18, padding:'15px 22px',
        }}>
          <svg width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2"
            viewBox="0 0 24 24" style={{color:'rgba(255,255,255,0.3)', flexShrink:0}}>
            <circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35" strokeLinecap="round"/>
          </svg>
          <input
            ref={inputRef}
            value={query} onChange={handleInput}
            placeholder="поиск треков, исполнителей..."
            style={{
              flex:1, background:'transparent', border:'none', outline:'none',
              color:'#ededf4', fontSize:18, fontFamily:'inherit',
            }}
          />
          {loading && <div style={{width:16,height:16,borderRadius:'50%',border:'2px solid rgba(255,255,255,0.15)',borderTopColor:'rgba(255,255,255,0.5)',animation:'spin 0.7s linear infinite',flexShrink:0}}/>}
        </div>
      </div>

      {/* results */}
      {hasResults && (
        <div onScroll={handleScroll}
          className="scroll-thin"
          style={{
            position:'absolute', left:0, right:10,
            top:'calc(8% + 76px)', bottom:0,
            overflowY:'auto', padding:'16px 52px 32px',
            willChange:'transform',
          }}>
          {users.length > 0 && (
            <div style={{marginBottom:22}}>
              <div style={{fontSize:10.5,letterSpacing:'0.09em',textTransform:'uppercase',color:'rgba(255,255,255,0.22)',marginBottom:10}}>Исполнители</div>
              <div style={{display:'grid', gridTemplateColumns:'repeat(4, 1fr)', gap:10}}>
                {users.slice(0, 4).map(u => (
                  <div key={u.id} style={{
                    display:'flex', alignItems:'center', gap:10,
                    background:'rgba(255,255,255,0.034)',
                    borderRadius:12, padding:'8px 14px',
                  }}>
                    {u.avatarUrl
                      ? <img src={u.avatarUrl} style={{width:30,height:30,borderRadius:'50%',objectFit:'cover'}}/>
                      : <div style={{width:30,height:30,borderRadius:'50%',background:'#111116',display:'flex',alignItems:'center',justifyContent:'center'}}>
                          <svg width="14" height="14" fill="none" stroke="rgba(255,255,255,0.3)" strokeWidth="1.6" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
                        </div>
                    }
                    <div>
                      <div style={{fontSize:12,color:'rgba(255,255,255,0.8)'}}>{u.username}</div>
                      {u.followersCount > 0 && <div style={{fontSize:10,color:'rgba(255,255,255,0.28)',marginTop:1}}>{u.followersCount.toLocaleString()} подписчиков</div>}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}
          {results.length > 0 && (
            <div>
              <div style={{fontSize:10.5,letterSpacing:'0.09em',textTransform:'uppercase',color:'rgba(255,255,255,0.22)',marginBottom:8}}>Треки</div>
              {results.map(t => (
                <SearchTrackRow key={t.id} track={t}
                  isLiked={likedIds.has(t.id)}
                  onLike={() => onLike(t)}
                  onClick={() => onSelectTrack(t)}
                  onCoverClick={() => onPlayTrack(t)}/>
              ))}
              {loading && <div style={{textAlign:'center',color:'rgba(255,255,255,0.2)',padding:'16px 0',fontSize:12}}>загрузка...</div>}
            </div>
          )}
        </div>
      )}
    </div>
  );
});

/* ── App ─────────────────────────────────────────────────────────────────── */
function App() {
  const [view,          setView]          = useState('home');
  const [tracks,        setTracks]        = useState([]);
  const [trackIdx,      setTrackIdx]      = useState(0);
  const [isPlaying,     setIsPlaying]     = useState(false);
  const [progress,      setProgress]      = useState(0);
  const [shuffle,       setShuffle]       = useState(false);
  const [repeat,        setRepeat]        = useState('off');
  const [navActive,     setNavActive]     = useState('home');
  const [search,        setSearch]        = useState('');
  const [volume,        setVolume]        = useState(0.7);
  const [hero,               setHero]               = useState(null);
  const [playerVisible,      setPlayerVisible]      = useState(false);
  const [homeVisible,        setHomeVisible]        = useState(true);
  const [heroExiting,        setHeroExiting]        = useState(false);
  const [artEntranceKey,     setArtEntranceKey]     = useState(0);
  const [reverseHero,        setReverseHero]        = useState(null);
  const [reverseHeroExiting, setReverseHeroExiting] = useState(false);
  const [avatarFly,          setAvatarFly]          = useState(null);
  const [avatarFlyExiting,   setAvatarFlyExiting]   = useState(false);
  const [avatarFlying,       setAvatarFlying]       = useState(false);
  const [libCollapsed,  setLibCollapsed]  = useState(false);
  const [settings,      setSettings]      = useState({
    autoplay:false, crossfade:0, defaultRepeat:false,
    startWithWindows:false, minimizeToTray:false, musicFolder:'',
    customTitles: {}, minDuration: 30, soundcloudAuth: null,
    sourceMode: 'local',
  });
  const [sort,         setSort]         = useState('added');
  const [editingTitle, setEditingTitle] = useState(false);
  const [editValue,    setEditValue]    = useState('');
  const [scTracks,      setScTracks]      = useState([]);
  const [scLoading,     setScLoading]     = useState(false);
  const [scUpdating,    setScUpdating]    = useState(false);
  const [scError,       setScError]       = useState(null);
  const [toast,         setToast]         = useState(null);
  const [toastExiting,  setToastExiting]  = useState(false);
  const [loadingTrackId, setLoadingTrackId] = useState(null);
  const [errorTrackId,   setErrorTrackId]   = useState(null);
  const errorTimerRef = useRef(null);
  const [scPlayingTrack, setScPlayingTrack] = useState(null);
  const [scPlayingIdx,   setScPlayingIdx]   = useState(-1);
  const [libScrollTrigger,  setLibScrollTrigger]  = useState(0);
  const [libScrollTargetId, setLibScrollTargetId] = useState(null);
  const [searchFocused,    setSearchFocused]    = useState(false);
  const editCancelRef  = useRef(false);

  const customTitlesRef = useRef({});
  customTitlesRef.current = settings.customTitles || {};

  const minDurationRef = useRef(30);
  minDurationRef.current = settings.minDuration ?? 30;

  const artRefs       = useRef({});
  const artRefCacheRef = useRef({});
  const getArtRef = useCallback((id) => {
    if (!artRefCacheRef.current[id]) {
      artRefCacheRef.current[id] = (el) => { artRefs.current[id] = el; };
    }
    return artRefCacheRef.current[id];
  }, []);
  const playerArtRef  = useRef(null);
  const audioRef      = useRef(null);
  const hlsRef        = useRef(null);
  const handleNextRef  = useRef(null);
  const handlePrevRef  = useRef(null);
  const isPlayingRef   = useRef(false);
  const homeScrollRef     = useRef(null);
  const scAvatarRef       = useRef(null);
  const sidebarProfileRef = useRef(null);
  const scTracksRef       = useRef([]);
  const scAuthRef         = useRef(null);
  const scCacheRef        = useRef([]);
  const scCacheMapRef     = useRef(new Map());
  const prevSearchRef     = useRef('');
  const homeSearchRef     = useRef(null);
  const libSearchRef      = useRef(null);
  const searchViewRef     = useRef(null);
  const discordTimerRef   = useRef(null);
  const discordProgressRef = useRef(0);
  const filteredRef       = useRef([]);
  const filteredScRef     = useRef([]);
  const searchRef         = useRef('');
  const volumeRef         = useRef(0.7);
  const settingsRef       = useRef({});
  const crossfadeRafRef   = useRef(null);
  discordProgressRef.current = progress;
  scTracksRef.current = scTracks;
  searchRef.current   = search;
  scAuthRef.current   = settings.soundcloudAuth;
  isPlayingRef.current = isPlaying;
  volumeRef.current    = volume;
  settingsRef.current  = settings;
  const track = scPlayingTrack || tracks[trackIdx] || tracks[0] || { id:0, title:'', artist:'', duration:0, color:'#333' };

  /* загружаем настройки и треки при старте */
  useEffect(() => {
    (async () => {
      try {
        const saved = await window.electronAPI.loadSettings();
        if (saved && Object.keys(saved).length) {
          setSettings(s => ({ ...s, ...saved }));
          if (saved.musicFolder) {
            const local = await window.electronAPI.scanMusicFolder(saved.musicFolder);
            if (local.length > 0) {
              const ct = saved.customTitles || {};
              const withCustom = local.map(t => ct[t.path] ? { ...t, title: ct[t.path] } : t);
              setTracks(withCustom);
              loadCovers(withCustom);
            }
          }
        }
      } catch {}
    })();
  }, []);

  /* сохраняем настройки при изменении */
  useEffect(() => {
    try { window.electronAPI.saveSettings(settings); } catch {}
  }, [settings]);

  /* инициализация Audio */
  useEffect(() => {
    const audio = new Audio();
    audio.volume = volume;
    audioRef.current = audio;

    const onTime  = () => {
      if (!audio.duration) return;
      setProgress(audio.currentTime / audio.duration);
      // crossfade fade-out: плавно убираем громкость в конце трека
      const cf = settingsRef.current?.crossfade || 0;
      if (cf > 0) {
        const remaining = audio.duration - audio.currentTime;
        if (remaining <= cf && remaining > 0) {
          audio.volume = Math.max(0, volumeRef.current * (remaining / cf));
        } else if (remaining > cf && audio.volume !== volumeRef.current) {
          audio.volume = volumeRef.current; // восстанавливаем если seek после fade
        }
      }
    };
    const onEnded = () => handleNextRef.current?.();
    audio.addEventListener('timeupdate', onTime);
    audio.addEventListener('ended',      onEnded);

    return () => {
      audio.removeEventListener('timeupdate', onTime);
      audio.removeEventListener('ended',      onEnded);
      audio.pause();
      audio.src = '';
      destroyHls();
      cancelAnimationFrame(crossfadeRafRef.current);
    };
  }, []);

  /* смена трека — обновляем src */
  useEffect(() => {
    const audio = audioRef.current;
    if (!audio || !track) return;
    if (scPlayingTrack) return; // SC-трек управляется через handleScTrackClick
    destroyHls(); // если был HLS — уничтожить при переключении на локальный трек
    if (track.path) {
      audio.src = 'file:///' + track.path.replace(/\\/g, '/');
      audio.load();
      audio.addEventListener('loadedmetadata', () => {
        const dur = Math.floor(audio.duration);
        if (dur) setTracks(prev => prev.map((t, i) => i === trackIdx ? { ...t, duration: dur } : t));
      }, { once: true });
      if (isPlayingRef.current) {
        startFadeIn(audio);
        audio.play().catch(() => setIsPlaying(false));
      }
    } else {
      audio.src = '';
    }
    setProgress(0);
  }, [trackIdx, track?.path, scPlayingTrack]);

  /* play / pause */
  useEffect(() => {
    const audio = audioRef.current;
    if (!audio) return;
    if (isPlaying) {
      audio.play().catch(() => setIsPlaying(false));
    } else {
      cancelAnimationFrame(crossfadeRafRef.current);
      audio.volume = volumeRef.current; // восстановить если fade-out прервал
      audio.pause();
    }
  }, [isPlaying]);

  /* громкость */
  useEffect(() => {
    if (audioRef.current) audioRef.current.volume = volume;
  }, [volume]);

  /* медиаклавиши */
  useEffect(() => {
    const api = window.electronAPI;
    if (!api?.onMediaPlayPause) return;
    api.onMediaPlayPause(() => setIsPlaying(p => !p));
    api.onMediaNext(() => handleNextRef.current?.());
    api.onMediaPrev(() => handlePrevRef.current?.());
  }, []);

  /* анимация обложки при входе в плеер не из home */
  useEffect(() => {
    if (view === 'player' && !hero) setArtEntranceKey(k => k + 1);
  }, [view]);

  /* плавный ресайз — отключаем transitions пока тянут окно */
  useEffect(() => {
    let t;
    const onResize = () => {
      document.body.classList.add('resizing');
      clearTimeout(t);
      t = setTimeout(() => document.body.classList.remove('resizing'), 150);
    };
    window.addEventListener('resize', onResize);
    return () => { window.removeEventListener('resize', onResize); clearTimeout(t); };
  }, []);

  /* ctrl+f → фокус на поиск */
  useEffect(() => {
    const handler = (e) => {
      if (e.ctrlKey && (e.key === 'f' || e.key === 'а')) {
        e.preventDefault();
        if (view === 'search') { searchViewRef.current?.focus(); }
        else if (view === 'player') { libSearchRef.current?.focus(); libSearchRef.current?.select(); }
        else { homeSearchRef.current?.focus(); homeSearchRef.current?.select(); }
      }
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, [view]);

  useEffect(() => {
    clearTimeout(discordTimerRef.current);
    discordTimerRef.current = setTimeout(() => {
      if (!track) { window.electronAPI?.discordClear?.(); return; }
      let coverUrl = (track.coverUrl || '').startsWith('https://') ? track.coverUrl : null;
      if (!coverUrl && scPlayingTrack) {
        const cached = scCacheMapRef.current.get(track.id);
        if (cached?.coverUrl?.startsWith('https://')) coverUrl = cached.coverUrl;
      }
      window.electronAPI?.discordUpdate?.({
        title:    track.title,
        artist:   track.artist,
        duration: track.duration,
        progress: discordProgressRef.current,
        coverUrl,
        isPlaying,
      });
    }, 800);
  }, [track?.id, isPlaying]);

  useEffect(() => () => window.electronAPI?.discordClear?.(), []);

  function handleNext() {
    if (repeat === 'one') {
      const audio = audioRef.current;
      if (audio) { audio.currentTime = 0; audio.play().catch(() => {}); }
      setProgress(0); return;
    }
    if (scPlayingTrack) {
      const list = searchRef.current ? filteredScRef.current : scTracksRef.current;
      const curIdx = list.findIndex(t => t.id === scPlayingTrack.id);
      const ni = curIdx + 1;
      if (ni < list.length) handleScTrackClick(list[ni], scTracksRef.current.indexOf(list[ni]));
      else if (repeat === 'all') handleScTrackClick(list[0], scTracksRef.current.indexOf(list[0]));
      else setIsPlaying(false);
      return;
    }
    const list = searchRef.current ? filteredRef.current : tracks;
    if (shuffle) {
      const cur = tracks[trackIdx];
      let n; do { n = Math.floor(Math.random()*list.length); } while (list[n] === cur && list.length > 1);
      setTrackIdx(tracks.indexOf(list[n]));
      setProgress(0); return;
    }
    const curIdx = list.indexOf(tracks[trackIdx]);
    const next = curIdx + 1;
    if (next >= list.length) {
      if (repeat === 'all') { setTrackIdx(tracks.indexOf(list[0])); }
      else { setIsPlaying(false); }
    } else {
      setTrackIdx(tracks.indexOf(list[next]));
    }
    setProgress(0);
  }
  handleNextRef.current = handleNext;

  function handlePrev() {
    if (progress > 0.05) {
      setProgress(0);
      if (audioRef.current) audioRef.current.currentTime = 0;
      return;
    }
    if (scPlayingTrack) {
      const list = searchRef.current ? filteredScRef.current : scTracksRef.current;
      const curIdx = list.findIndex(t => t.id === scPlayingTrack.id);
      const pi = curIdx - 1;
      if (pi >= 0) handleScTrackClick(list[pi], scTracksRef.current.indexOf(list[pi]));
      return;
    }
    const list = searchRef.current ? filteredRef.current : tracks;
    const curIdx = list.indexOf(tracks[trackIdx]);
    setTrackIdx(tracks.indexOf(list[(curIdx - 1 + list.length) % list.length]));
    setProgress(0);
  }
  handlePrevRef.current = handlePrev;

  const handleSeek = useCallback((v) => {
    setProgress(v);
    discordProgressRef.current = v;
    cancelAnimationFrame(crossfadeRafRef.current); // отменяем fade если был
    const audio = audioRef.current;
    if (audio?.duration) {
      audio.currentTime = v * audio.duration;
      audio.volume = volumeRef.current; // восстанавливаем громкость после seek
    }
    clearTimeout(discordTimerRef.current);
    discordTimerRef.current = setTimeout(() => {
      const t = track;
      if (!t) return;
      let coverUrl = (t.coverUrl || '').startsWith('https://') ? t.coverUrl : null;
      if (!coverUrl && scPlayingTrack) {
        const cached = scCacheMapRef.current.get(t.id);
        if (cached?.coverUrl?.startsWith('https://')) coverUrl = cached.coverUrl;
      }
      window.electronAPI?.discordUpdate?.({
        title: t.title, artist: t.artist, duration: t.duration,
        progress: v, coverUrl, isPlaying: isPlayingRef.current,
      });
    }, 400);
  }, [track, scPlayingTrack]);

  useEffect(() => { setEditingTitle(false); }, [trackIdx]);

  useEffect(() => {
    if (prevSearchRef.current && !search && scPlayingTrack) {
      setLibScrollTargetId(null);
      setLibScrollTrigger(v => v + 1);
    }
    prevSearchRef.current = search;
  }, [search]);

  const commitEdit = () => {
    const trimmed = editValue.trim();
    if (trimmed) {
      setTracks(prev => prev.map((t, i) => i === trackIdx ? { ...t, title: trimmed } : t));
      const path = tracks[trackIdx]?.path;
      if (path) {
        setSettings(s => ({ ...s, customTitles: { ...s.customTitles, [path]: trimmed } }));
      }
    }
    setEditingTitle(false);
  };

  async function loadCovers(tracksArr) {
    const pending = tracksArr.filter(t => t.path);
    if (!pending.length) return;
    let next = 0;
    const acc = {};
    let newSinceFlush = 0;

    const flush = () => {
      if (!newSinceFlush) return;
      newSinceFlush = 0;
      const snap = { ...acc };
      setTracks(prev => prev.map(t => snap[t.id] ? { ...t, coverUrl: snap[t.id] } : t));
    };

    async function worker() {
      while (next < pending.length) {
        const t = pending[next++];
        try {
          const url = await window.electronAPI.getCoverArt(t.path);
          if (url) { acc[t.id] = url; newSinceFlush++; }
        } catch {}
        if (newSinceFlush >= 16) flush();
      }
    }

    await Promise.all(Array.from({ length: Math.min(16, pending.length) }, worker));
    flush();
  }

  const handleScanTracks = useCallback(async (folder) => {
    try {
      const local = await window.electronAPI.scanMusicFolder(folder, minDurationRef.current);
      if (local.length > 0) {
        const ct = customTitlesRef.current;
        const withCustom = local.map(t => ct[t.path] ? { ...t, title: ct[t.path] } : t);
        setTracks(withCustom);
        setTrackIdx(0);
        setIsPlaying(false);
        setProgress(0);
        loadCovers(withCustom);
      }
    } catch {}
  }, []);

  const handleClearCoversCache = useCallback(async () => {
    await window.electronAPI.scClearCoversCache();
    setScTracks(t => t.map(tr => ({ ...tr, coverUrl: null })));
  }, []);

  const handleClearLikesCache = useCallback(async () => {
    await window.electronAPI.scClearLikesCache();
    setScTracks([]);
    scCacheRef.current = [];
    scCacheMapRef.current = new Map();
  }, []);

  const handleClearFolder = useCallback(() => {
    setSettings(s => ({ ...s, musicFolder: null }));
    setTracks([]);
    setTrackIdx(0);
    setIsPlaying(false);
    setProgress(0);
  }, []);

  const loadScLikes = useCallback(async (auth, opts = {}) => {
    const silent = opts.silent === true;
    if (silent) setScUpdating(true);
    else { setScLoading(true); setScTracks([]); }
    setScError(null);
    const all = [];
    let userId = auth.userId;
    if (!userId) {
      const me = await window.electronAPI.scFetch('https://api-v2.soundcloud.com/me', auth.token, auth.clientId);
      if (me.data?.id) userId = me.data.id;
      else {
        setScError(`не удалось получить userId: ${me.error ?? 'нет данных'}`);
        if (silent) setScUpdating(false); else setScLoading(false);
        return;
      }
    }
    let url = `https://api-v2.soundcloud.com/users/${userId}/likes?limit=200`;
    let pages = 0;
    try {
      while (url && pages < 20) {
        const res = await window.electronAPI.scFetch(url, auth.token, auth.clientId);
        if (res.error) { setScError(`ошибка api: ${res.error}`); break; }
        if (!res.data?.collection) break;
        for (const item of res.data.collection) {
          const t = item.track;
          if (!t?.id) continue;
          const progressive = t.media?.transcodings?.find(tc => tc.format?.protocol === 'progressive');
          const hls = t.media?.transcodings?.find(tc => tc.format?.protocol === 'hls');
          all.push({
            id: t.id,
            title: t.title || 'Без названия',
            artist: t.publisher_metadata?.artist || t.user?.username || '',
            duration: Math.floor((t.duration || 0) / 1000),
            color: scHashColor(t.id),
            coverUrl: t.artwork_url ? t.artwork_url.replace('-large', '-t500x500') : null,
            streamUrl: progressive?.url || null,
            hlsUrl: hls?.url || null,
          });
        }
        url = res.data.next_href || null;
        pages++;
      }
    } catch (e) {
      setScError(String(e));
      console.error('loadScLikes:', e);
    }
    if (all.length) {
      scCacheRef.current = all;
      scCacheMapRef.current = new Map(all.map(t => [t.id, t]));
      window.electronAPI.scSaveLikesCache(all);
      const cached = await window.electronAPI.scCheckCovers(all.map(t => t.id));
      const withCache = all.map(t => cached[t.id] ? { ...t, coverUrl: cached[t.id] } : t);
      setScTracks(withCache);
      if (silent) setScUpdating(false); else setScLoading(false);
      loadScCovers(withCache.filter(t => !cached[t.id]));
    } else {
      if (!silent) setScTracks(all);
      if (silent) setScUpdating(false); else setScLoading(false);
    }
  }, []);

  const loadScCovers = useCallback(async (tracksArr) => {
    const pending = tracksArr.filter(t => t.coverUrl);
    if (!pending.length) return;
    let next = 0;
    const acc = {};
    let newSinceFlush = 0;
    const flush = () => {
      if (!newSinceFlush) return;
      newSinceFlush = 0;
      const snap = { ...acc };
      setScTracks(prev => prev.map(t => snap[t.id] ? { ...t, coverUrl: snap[t.id] } : t));
    };
    async function worker() {
      while (next < pending.length) {
        const t = pending[next++];
        try {
          const local = await window.electronAPI.scCacheCover(t.id, t.coverUrl);
          if (local) { acc[t.id] = local; newSinceFlush++; }
        } catch {}
        if (newSinceFlush >= 20) flush();
      }
    }
    await Promise.all(Array.from({ length: Math.min(6, pending.length) }, worker));
    flush();
  }, []);

  const incrementalScUpdate = useCallback(async (auth) => {
    if (!auth?.userId) return;
    setScUpdating(true);
    setScError(null);
    const knownIds = new Set(scCacheRef.current.map(t => t.id));
    const newest = [];
    let url = `https://api-v2.soundcloud.com/users/${auth.userId}/likes?limit=200`;
    let pages = 0;
    let foundKnown = false;
    try {
      while (url && pages < 20 && !foundKnown) {
        const res = await window.electronAPI.scFetch(url, auth.token, auth.clientId);
        if (res.error) { setScError(`ошибка api: ${res.error}`); break; }
        if (!res.data?.collection) break;
        for (const item of res.data.collection) {
          const t = item.track;
          if (!t?.id) continue;
          if (knownIds.has(t.id)) { foundKnown = true; break; }
          const progressive = t.media?.transcodings?.find(tc => tc.format?.protocol === 'progressive');
          const hls = t.media?.transcodings?.find(tc => tc.format?.protocol === 'hls');
          newest.push({
            id: t.id,
            title: t.title || 'Без названия',
            artist: t.publisher_metadata?.artist || t.user?.username || '',
            duration: Math.floor((t.duration || 0) / 1000),
            color: scHashColor(t.id),
            coverUrl: t.artwork_url ? t.artwork_url.replace('-large', '-t500x500') : null,
            streamUrl: progressive?.url || null,
            hlsUrl: hls?.url || null,
          });
        }
        if (foundKnown) break;
        url = res.data.next_href || null;
        pages++;
      }
    } catch (e) {
      setScError(String(e));
      console.error('incrementalScUpdate:', e);
      setScUpdating(false);
      return;
    }
    if (foundKnown) {
      if (newest.length > 0) {
        const cachedCovers = await window.electronAPI.scCheckCovers(newest.map(t => t.id));
        const newestWithCovers = newest.map(t => cachedCovers[t.id] ? { ...t, coverUrl: cachedCovers[t.id] } : t);
        setScTracks(prev => [...newestWithCovers, ...prev]);
        scCacheRef.current = [...newest, ...scCacheRef.current];
        newest.forEach(t => scCacheMapRef.current.set(t.id, t));
        window.electronAPI.scSaveLikesCache(scCacheRef.current);
        loadScCovers(newestWithCovers.filter(t => !cachedCovers[t.id]));
      }
      setScUpdating(false);
    } else {
      setScUpdating(false);
      loadScLikes(auth, { silent: true });
    }
  }, [loadScLikes, loadScCovers]);

  const initScLikes = useCallback(async (auth) => {
    const cache = await window.electronAPI.scLoadLikesCache();
    const cacheValid = cache && cache.length > 0 && Object.prototype.hasOwnProperty.call(cache[0], 'hlsUrl');
    if (cacheValid) {
      scCacheRef.current = cache;
      scCacheMapRef.current = new Map(cache.map(t => [t.id, t]));
      const cachedCovers = await window.electronAPI.scCheckCovers(cache.map(t => t.id));
      const withCovers = cache.map(t => cachedCovers[t.id] ? { ...t, coverUrl: cachedCovers[t.id] } : t);
      setScTracks(withCovers);
      setScLoading(false);
      loadScCovers(withCovers.filter(t => t.coverUrl && !t.coverUrl.startsWith('file:')));
      incrementalScUpdate(auth);
    } else {
      loadScLikes(auth);
    }
  }, [loadScLikes, loadScCovers, incrementalScUpdate]);

  useEffect(() => {
    if (settings.soundcloudAuth?.token) initScLikes(settings.soundcloudAuth);
    else { setScTracks([]); scCacheRef.current = []; scCacheMapRef.current = new Map(); }
  }, [settings.soundcloudAuth]);

  const handleScLogin = useCallback((auth) => {
    const startEl  = scAvatarRef.current;
    const targetEl = sidebarProfileRef.current;
    setSettings(s => ({ ...s, soundcloudAuth: auth, sourceMode: 'sc' }));
    if (startEl && targetEl && auth.avatarUrl) {
      const startRect  = startEl.getBoundingClientRect();
      const targetRect = targetEl.getBoundingClientRect();
      setAvatarFlying(true);
      setAvatarFly({ avatarUrl: auth.avatarUrl, startRect, targetRect });
      setTimeout(() => { setAvatarFlying(false); setAvatarFlyExiting(true); }, 400);
      setTimeout(() => { setAvatarFly(null); setAvatarFlyExiting(false); }, 560);
    }
  }, []);
  const handleScLogout = useCallback(() => {
    scCacheRef.current = [];
    scCacheMapRef.current = new Map();
    try { window.electronAPI.scSaveLikesCache([]); } catch {}
    setSettings(s => ({ ...s, soundcloudAuth: null, sourceMode: 'local' }));
  }, []);
  const handleToggleSource = useCallback(() => setSettings(s => ({ ...s, sourceMode: s.sourceMode === 'sc' ? 'local' : 'sc' })), []);
  const sourceMode = (settings.soundcloudAuth && settings.sourceMode === 'sc') ? 'sc' : 'local';

  const toastTimerRef = useRef(null);
  function showToast(msg) {
    setToast(msg);
    setToastExiting(false);
    clearTimeout(toastTimerRef.current);
    toastTimerRef.current = setTimeout(() => {
      setToastExiting(true);
      setTimeout(() => { setToast(null); setToastExiting(false); }, 240);
    }, 2200);
  }

  function startFadeIn(audio) {
    cancelAnimationFrame(crossfadeRafRef.current);
    const cf = settingsRef.current?.crossfade || 0;
    if (cf <= 0) { audio.volume = volumeRef.current; return; }
    audio.volume = 0;
    const target = volumeRef.current;
    const startMs = performance.now();
    const tick = (now) => {
      const t = Math.min(1, (now - startMs) / (cf * 1000));
      audio.volume = target * t;
      if (t < 1) crossfadeRafRef.current = requestAnimationFrame(tick);
    };
    crossfadeRafRef.current = requestAnimationFrame(tick);
  }

  function destroyHls() {
    if (hlsRef.current) { hlsRef.current.destroy(); hlsRef.current = null; }
  }

  async function handleScTrackClick(scTrack, idx) {
    setScPlayingIdx(idx);
    setProgress(0);
    setIsPlaying(false);
    setLoadingTrackId(scTrack.id);
    destroyHls();

    const auth = scAuthRef.current;
    if (!auth) { setLoadingTrackId(null); return; }

    if (!scTrack.streamUrl && !scTrack.hlsUrl) { setLoadingTrackId(null); clearTimeout(errorTimerRef.current); setErrorTrackId(scTrack.id); errorTimerRef.current = setTimeout(()=>setErrorTrackId(null), 2200); return; }

    let resolvedUrl = null;
    let isHls = false;

    if (scTrack.streamUrl) {
      const res = await window.electronAPI.scFetch(scTrack.streamUrl, auth.token, auth.clientId);
      if (res.data?.url) resolvedUrl = res.data.url;
    }
    if (!resolvedUrl && scTrack.hlsUrl) {
      const res = await window.electronAPI.scFetch(scTrack.hlsUrl, auth.token, auth.clientId);
      if (res.data?.url) { resolvedUrl = res.data.url; isHls = true; }
    }

    if (!resolvedUrl) { setLoadingTrackId(null); clearTimeout(errorTimerRef.current); setErrorTrackId(scTrack.id); errorTimerRef.current = setTimeout(()=>setErrorTrackId(null), 2200); return; }

    const resolved = { ...scTrack, resolvedUrl };
    setScPlayingTrack(resolved);

    const audio = audioRef.current;
    if (!audio) { setLoadingTrackId(null); return; }

    if (isHls && typeof Hls !== 'undefined' && Hls.isSupported()) {
      const hls = new Hls();
      hlsRef.current = hls;
      hls.loadSource(resolvedUrl);
      hls.attachMedia(audio);
      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        startFadeIn(audio);
        audio.play().then(() => setLoadingTrackId(null)).catch(() => { setLoadingTrackId(null); setIsPlaying(false); });
        setIsPlaying(true);
      });
      hls.on(Hls.Events.LEVEL_LOADED, (_, data) => {
        const dur = Math.floor(data.details.totalduration || 0);
        if (dur) setScPlayingTrack(prev => prev ? { ...prev, duration: dur } : prev);
      });
    } else {
      audio.src = resolvedUrl;
      audio.load();
      audio.addEventListener('loadedmetadata', () => {
        const dur = Math.floor(audio.duration);
        if (dur) setScPlayingTrack(prev => prev ? { ...prev, duration: dur } : prev);
      }, { once: true });
      startFadeIn(audio);
      audio.play().then(() => setLoadingTrackId(null)).catch(() => { setLoadingTrackId(null); setIsPlaying(false); });
      setIsPlaying(true);
    }
  }

  function selectTrack(t) {
    const startPlayLocal = (idx) => {
      setScPlayingTrack(null);
      setTrackIdx(idx);
      setProgress(0);
      setIsPlaying(true);
    };
    const startPlay = () => {
      if (sourceMode === 'sc') {
        const scIdx = scTracks.indexOf(t);
        if (scIdx >= 0) handleScTrackClick(t, scIdx);
      } else {
        const li = tracks.indexOf(t);
        if (li >= 0) startPlayLocal(li);
      }
    };

    if (view === 'player') {
      startPlay();
      return;

    const artEl = artRefs.current[t.id];
    const startRect = artEl ? artEl.getBoundingClientRect() : { left:0, top:0, width:0, height:0 };
    const par = playerArtRef.current?.getBoundingClientRect();
    const targetRect = par ? { left: par.left, top: par.top, size: par.width } : { left: 0, top: 0, size: 260 };

    startPlay();

    setPlayerVisible(true);

  const handleLike = useCallback(async (track) => {
    const auth = scAuthRef.current;
    if (!auth) return;
    const already = scTracksRef.current.some(t => t.id === track.id);
    if (already) {
      await window.electronAPI.scFetch(
        `https://api-v2.soundcloud.com/me/track_likes/${track.id}`,
        auth.token, auth.clientId, 'DELETE'

      setScTracks(prev => prev.filter(t => t.id !== track.id));
      scCacheRef.current = scCacheRef.current.filter(t => t.id !== track.id);
      scCacheMapRef.current.delete(track.id);
    } else {
      await window.electronAPI.scFetch(
        `https://api-v2.soundcloud.com/me/track_likes/${track.id}`,

      scCacheRef.current = [track, ...scCacheRef.current];

    return arr;

  filteredRef.current = filtered;

      t.title.toLowerCase().includes(searchLower) ||

  filteredScRef.current = filteredSc;

            const visible = cr.top >= box.top && cr.bottom <= box.bottom;
            if (!visible) {

      setPlayerVisible(true);

      <div style={{position:'relative', flex:1, height:'100%', overflow:'hidden'}}>

              {sourceMode === 'sc' && scLoading && (

                  {scError} — <span style={{cursor:'pointer', textDecoration:'underline'}}

                </div>
              )}
              <div style={{
                display:'flex', alignItems:'center', gap:9,
                background: searchFocused ? 'rgba(255,255,255,0.065)' : 'rgba(255,255,255,0.04)',

              }}>
                <svg width="12" height="12" fill="none" stroke="currentColor" strokeWidth="2.2"

                </svg>
                <input

              <input

                value={search}
                onChange={e=>setSearch(e.target.value)}
                onFocus={() => setSearchFocused(true)}
                onBlur={() => setSearchFocused(false)}
                placeholder="поиск..."
                style={{flex:1, background:'none', border:'none', outline:'none',

              {search && (

          <div style={{
            width:'min(calc(100% - 64px), calc(100vh - 320px))',
            maxWidth:480, minWidth:220,
            display:'flex', flexDirection:'column',
            alignItems:'center', gap:0,
          }}>
            <div id="player-album-art" ref={playerArtRef} style={{width:'100%', marginBottom:22, opacity: ((hero && !heroExiting) || reverseHero) ? 0 : 1}}>
              <div key={artEntranceKey} style={{animation: artEntranceKey > 0 ? 'artEntrance 0.42s cubic-bezier(0.34,1.56,0.64,1)' : 'none'}}>
                <AlbumArt track={track} isPlaying={isPlaying}/>
              </div>
            </div>
            <div style={{
              textAlign:'center', marginBottom:18, width:'100%',
              transform: playerVisible ? 'translateY(0)' : 'translateY(10px)',
              transition: playerVisible
                ? 'transform 0.48s cubic-bezier(0.22,1,0.36,1) 0.12s'
                : 'transform 0.15s ease',
            }}>
              {editingTitle ? (
                <div style={{display:'flex', justifyContent:'center', width:'100%'}}>
                  <div style={{
                    display:'inline-flex', alignItems:'center',
                    background:'rgba(255,255,255,0.055)',
                    borderRadius:11, padding:'7px 18px',
                    boxShadow:'0 4px 28px rgba(0,0,0,0.45)',
                    maxWidth:'100%',
                  }}>
                    <input
                      autoFocus
                      value={editValue}
                      onChange={e => setEditValue(e.target.value)}
                      onKeyDown={e => {
                        if (e.key === 'Enter')  { editCancelRef.current = false; commitEdit(); }
                        if (e.key === 'Escape') { editCancelRef.current = true;  setEditingTitle(false); }
                      }}
                      onBlur={() => { if (!editCancelRef.current) commitEdit(); editCancelRef.current = false; }}
                      style={{
                        background:'none', border:'none', outline:'none',
                        fontSize:22, fontWeight:600, letterSpacing:'-0.022em',
                        color:'#ededf4', textAlign:'center',
                        fontFamily:'Space Grotesk,sans-serif',
                        width: Math.max(80, editValue.length * 13) + 'px',
                        maxWidth:'100%',
                      }}
                    />
                  </div>
                </div>
              ) : (
                <div
                  onClick={e => {
                    if (e.shiftKey) { editCancelRef.current = false; setEditValue(track.title); setEditingTitle(true); }
                    else { setLibScrollTargetId(track.id); setLibScrollTrigger(v => v + 1); }
                  }}
                  style={{
                    fontSize:22, fontWeight:600, letterSpacing:'-0.022em',
                    whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis',
                    opacity: playerVisible ? 1 : 0,
                    transition: playerVisible ? 'opacity 0.36s ease 0.12s' : 'opacity 0.1s ease',
                    cursor:'pointer',
                  }}>{track.title}</div>
              )}
              <div style={{
                fontSize:12, color:'rgba(255,255,255,0.28)', marginTop:4,
                opacity: playerVisible ? 1 : 0,
                transition: playerVisible ? 'opacity 0.36s ease 0.2s' : 'opacity 0.1s ease',
              }}>{track.artist}</div>
            </div>
            <div style={{
              width:'100%', marginBottom:20,
              opacity: playerVisible ? 1 : 0,
              transform: playerVisible ? 'translateY(0)' : 'translateY(10px)',
              transition: playerVisible ? 'opacity 0.36s ease 0.28s, transform 0.48s cubic-bezier(0.22,1,0.36,1) 0.28s' : 'opacity 0.1s ease, transform 0.1s ease',
            }}>
              <WaveProgressBar progress={progress} elapsed={elapsed} total={track.duration || 0}
                onSeek={handleSeek} isPlaying={isPlaying} visible={playerVisible}/>
            </div>
            {(()=>{ const P = { spring:0.055, damping:0.84, clamp:10 }; return (
            <div style={{display:'flex', alignItems:'center', gap:8, justifyContent:'center',
              opacity: playerVisible ? 1 : 0,
              transform: playerVisible ? 'translateY(0)' : 'translateY(10px)',
              transition: playerVisible ? 'opacity 0.36s ease 0.38s, transform 0.48s cubic-bezier(0.22,1,0.36,1) 0.38s' : 'opacity 0.1s ease, transform 0.1s ease',
            }}>
              <MagBtn onClick={()=>setShuffle(s=>!s)} active={shuffle} size={48} physics={P}>
                <img src="../assets/shuffle.png" style={{width:22,height:22,filter:'brightness(0) invert(1)',opacity:shuffle?1:0.38,transition:'opacity 0.2s ease'}}/>
              </MagBtn>
              <MagBtn onClick={handlePrev} size={54} physics={P}>
                <img src="../assets/rewind.png" style={{width:22,height:22,filter:'brightness(0) invert(1)',opacity:0.38}}/>
              </MagBtn>
              <PlayBtn isPlaying={isPlaying} onToggle={()=>setIsPlaying(p=>!p)} physics={P}/>
              <MagBtn onClick={handleNext} size={54} physics={P}>
                <img src="../assets/forward.png" style={{width:22,height:22,filter:'brightness(0) invert(1)',opacity:0.38}}/>
              </MagBtn>
              <MagBtn onClick={()=>setRepeat(r=>r==='off'?'all':r==='all'?'one':'off')} active={repeat!=='off'} size={48} physics={P}>
                <div style={{position:'relative',width:22,height:22}}>
                  <img src="../assets/repeat.png"  style={{position:'absolute',width:22,height:22,filter:'brightness(0) invert(1)',opacity:repeat==='off'?0.38:repeat==='all'?1:0,transition:'opacity 0.2s ease'}}/>
                  <img src="../assets/repeat1.png" style={{position:'absolute',width:22,height:22,filter:'brightness(0) invert(1)',opacity:repeat==='one'?1:0,transition:'opacity 0.2s ease'}}/>
                </div>
              </MagBtn>
            </div>
            ); })()}
          </div>
        </div>

        {/* volume panel */}
        <div style={{
          width:28, flexShrink:0, height:'100%',
          display:'flex', flexDirection:'column', alignItems:'center',
          paddingTop:110, paddingBottom:110, paddingRight:5,
          opacity: playerVisible ? 1 : 0,
          transform: playerVisible ? 'translateX(0)' : 'translateX(8px)',
          transition: playerVisible ? 'opacity 0.36s ease 0.44s, transform 0.48s cubic-bezier(0.22,1,0.36,1) 0.44s' : 'opacity 0.1s ease, transform 0.1s ease',
        }}>
          <ThinVolumeSlider volume={volume} onChange={setVolume}/>
        </div>
          </div>
        )}

        <SettingsView settings={settings} onSettings={setSettings} visible={view==='settings'} onScanTracks={handleScanTracks} onClearFolder={handleClearFolder} onClearCoversCache={handleClearCoversCache} onClearLikesCache={handleClearLikesCache}/>
        <SoundCloudView visible={view==='soundcloud'} scAuth={settings.soundcloudAuth||null} onLogin={handleScLogin} onLogout={handleScLogout} avatarRef={scAvatarRef}/>
        <SearchView ref={searchViewRef} visible={view==='search'} scAuth={settings.soundcloudAuth||null}
          likedIds={likedIds} onLike={handleLike}
          onPlayTrack={t => { handleScTrackClick(t, -1); }}
          onSelectTrack={t => { handleScTrackClick(t, -1); setPlayerVisible(true); setView('player'); setNavActive('library'); }}/>

        {toast && (
          <div style={{
            position:'absolute', bottom:28, left:'50%',
            background:'rgba(30,30,36,0.97)',
            borderRadius:8, padding:'7px 13px', fontSize:12,
            color:'rgba(255,255,255,0.45)', pointerEvents:'none',
            zIndex:9999, whiteSpace:'nowrap',
            animation: toastExiting
              ? 'fadeOutDown 0.24s ease forwards'
              : 'fadeInUp 0.18s ease',
          }}>{toast}</div>
        )}

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
